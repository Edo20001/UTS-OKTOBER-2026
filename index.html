  `<b>Menumbuhkan wawasan kebangsaan dan bela negara.</b> Artinya paham Pancasila, UUD 1945, NKRI, dan Bhinneka Tunggal Ika, supaya bangsa tidak mudah terpecah hanya karena beda suku atau agama.`,
  `<b>Melatih sikap demokratis dan kritis.</b> Berani berpendapat dengan sopan, menghargai pendapat yang berbeda, dan ikut berpartisipasi tanpa memaksakan kehendak.`,
  `<b>Menjawab tantangan global.</b> Globalisasi membawa budaya dan ideologi asing, sikap individualistis, dan krisis identitas. PKn menguatkan jati diri bangsa.`,
  `<b>Peran PKn di era digital (bisa dipakai sebagai contoh jawaban):</b>
   <br>1. Hoaks dan ujaran kebencian: cek kebenaran info sebelum share, patuhi UU ITE.
   <br>2. Radikalisme dan intoleransi online: nilai Pancasila jadi saringan konten yang memecah belah.
   <br>3. Cyberbullying dan pelanggaran privasi: sila ke-2, hormati hak orang lain di dunia maya.
   <br>4. Aspirasi: sampaikan lewat petisi online atau kanal pengaduan resmi, bukan provokasi.`
 ],ingat:'Pola jawaban "mengapa PKn penting": hukum, karakter, kebangsaan, demokrasi, tantangan global.'},
 {id:'pkn2',t:'Pancasila dan konflik',gist:'Konflik terjadi saat nilai Pancasila tidak dijalankan. Jadi setiap sila bisa dipakai untuk membaca penyebab sebuah konflik.',pts:[
  `<b>Cara menjawab soal penyebab konflik:</b> ambil satu sila, lalu tulis perilaku yang melanggarnya. Itulah penyebab konfliknya (lihat tabel di bawah).`,
  `<b>Sila pedoman penyelesaian konflik.</b> Pada dasarnya kelima sila, tapi yang paling utama adalah <b>sila ke-4 (musyawarah mufakat)</b>: selesaikan lewat dialog, bukan kekerasan.`,
  `Sila lainnya membantu begini: sila ke-2 mengajarkan saling menghormati dan tidak main hakim sendiri; sila ke-3 mengingatkan kepentingan bangsa di atas golongan; sila ke-1 mendorong toleransi; sila ke-5 menjamin penyelesaian yang adil bagi semua pihak.`,
  `<b>Contoh konflik terbaru:</b>
   <br>1. Rempang Eco-City (Batam): sengketa lahan antara pembangunan dan masyarakat adat.
   <br>2. Penolakan atau masalah izin rumah ibadah di beberapa daerah.
   <br>3. Tawuran antarpelajar dan antarwarga.
   <br>4. Demo besar Agustus 2025 karena kekecewaan pada kebijakan dan tunjangan anggota DPR.
   <br>5. Hoaks dan ujaran kebencian di medsos saat politik memanas.`,
  `<b>Tips:</b> pilih satu atau dua contoh yang paling kamu pahami, dan cek berita terbaru supaya contohmu tidak ketinggalan.`
 ],vis:()=>[V.table('Penyebab konflik per sila',['Sila','Penyebab konflik'],[
  ['1 Ketuhanan','Intoleransi, memaksakan keyakinan, menolak rumah ibadah, penistaan agama'],['2 Kemanusiaan','Diskriminasi, kekerasan, perundungan, pelanggaran HAM, kurang empati'],['3 Persatuan','Fanatik suku/golongan, sentimen SARA, separatisme'],['4 Kerakyatan','Abaikan musyawarah, memaksa kehendak, kebijakan tanpa melibatkan rakyat, politik uang'],['5 Keadilan sosial','Kesenjangan ekonomi, hukum tidak adil, sengketa lahan, korupsi']])]},
 {id:'pkn3',t:'Perubahan UUD 1945',gist:'UUD 1945 diubah 4 kali pada 1999–2002 (era Reformasi). Jawabannya: ya, perubahan itu memperkuat demokrasi, tapi praktiknya masih punya masalah.',pts:[
  `<b>Kenapa dibilang memperkuat demokrasi? Ada 5 alasan:</b>
   <br>1. <b>Kekuasaan presiden dibatasi:</b> maksimal 2 periode (Pasal 7). Dulu tidak jelas, jadi bisa berkuasa sangat lama.
   <br>2. <b>Rakyat memilih langsung</b> presiden dan wapres (Pasal 6A). Dulu dipilih MPR.
   <br>3. <b>Saling mengawasi antar lembaga (checks and balances):</b> DPR memegang pembuatan UU (Pasal 20), dan ada lembaga baru seperti Mahkamah Konstitusi dan Komisi Yudisial.
   <br>4. <b>HAM dijamin lebih lengkap</b> (Pasal 28A–28J).
   <br>5. <b>Daerah lebih terwakili:</b> ada DPD dan otonomi daerah.`,
  `<b>Kelemahannya:</b> politik uang, oligarki (kekuasaan dipegang segelintir orang kaya), dan korupsi masih terjadi. Artinya aturannya sudah bagus, tapi kualitas demokrasi tetap bergantung pada pelaksanaannya.`,
  `<b>Pasal cadangan</b> kalau diminta lima pasal: Pasal 1 ayat (3) negara hukum, Pasal 22E pemilu, Pasal 22C DPD, Pasal 24B Komisi Yudisial.`
 ],ingat:'Angka kunci: 4 kali diubah, tahun 1999–2002, maksimal 2 periode, Pasal 6A pemilihan langsung, Pasal 24C Mahkamah Konstitusi.',vis:()=>[V.table('5 pasal kunci',['Pasal','Isinya'],[
  ['1 ayat (2)','Kedaulatan di tangan rakyat (dulu sepenuhnya dipegang MPR)'],['6A','Presiden dan Wapres dipilih langsung oleh rakyat'],['7','Masa jabatan 5 tahun, boleh dipilih lagi hanya satu kali'],['24C','Dibentuk Mahkamah Konstitusi (menguji UU terhadap UUD, dll.)'],['28A–28J','Jaminan hak asasi manusia yang rinci']])]},
 {id:'pkn4',t:'Negara dan warga negara',gist:'Negara dan warga saling membutuhkan: negara melindungi dan menyejahterakan, warga menaati hukum dan ikut membela negara.',pts:[
  `<b>Hak dan kewajiban timbal balik.</b> Negara wajib melindungi, menyejahterakan, dan menjamin hak warga. Warga wajib menaati hukum, membayar pajak, dan membela negara.`,
  `<b>Kedaulatan rakyat.</b> Rakyat pemilik kekuasaan tertinggi, pemerintah hanya menjalankan mandat rakyat (Pasal 1 ayat 2). ${e('seperti pemilik rumah dan pengurus rumah: pengurus bekerja atas nama pemilik')}`,
  `<b>Teori kontrak sosial</b> (Hobbes, Locke, Rousseau). Negara ada karena warga sepakat membentuknya demi melindungi kepentingan bersama.`,
  `<b>Negara hukum</b> (Pasal 1 ayat 3). Hubungan negara dan warga diatur hukum, jadi negara tidak boleh bertindak sewenang-wenang.`,
  `<b>Kekeluargaan dan gotong royong</b> sesuai Pancasila: negara dan warga satu kesatuan yang saling mendukung.`,
  `<b>Status kewarganegaraan</b> diatur Pasal 26. Dari situ ditentukan siapa yang punya hak dan kewajiban sebagai warga negara.`,
  `<b>Contoh negara kepada warga (hak warga):</b> pendidikan (Pasal 31, misalnya KIP), jaminan kesehatan (BPJS), layanan KTP dan paspor, perlindungan hukum, fasilitas umum.`,
  `<b>Contoh warga kepada negara (kewajiban):</b> membayar pajak, ikut pemilu, menaati hukum, bela negara (Pasal 27 ayat 3 dan Pasal 30).`
 ]},
 {id:'pkn5',t:'Demokrasi Pancasila',gist:'Demokrasi Pancasila adalah demokrasi "dari, oleh, untuk rakyat" ala Lincoln, ditambah musyawarah dan nilai-nilai Pancasila.',pts:[
  `<b>Menurut Lincoln</b> (Pidato Gettysburg, 1863), demokrasi adalah pemerintahan dari rakyat, oleh rakyat, dan untuk rakyat.
   <br>1. <b>Dari rakyat:</b> kekuasaan berasal dari rakyat, pemimpin adalah wakil rakyat.
   <br>2. <b>Oleh rakyat:</b> rakyat ikut menjalankan pemerintahan, misalnya lewat pemilu.
   <br>3. <b>Untuk rakyat:</b> tujuannya kesejahteraan rakyat, bukan segelintir elite.`,
  `<b>Relevan dengan Indonesia:</b> "dari rakyat" sesuai Pasal 1 ayat (2); "oleh rakyat" karena kita memilih presiden, DPR, DPD, dan kepala daerah secara langsung; "untuk rakyat" sesuai sila ke-5 dan tujuan negara di Pembukaan UUD 1945 (memajukan kesejahteraan umum, mencerdaskan kehidupan bangsa).`,
  `<b>Kekhasan Demokrasi Pancasila:</b> tidak hanya suara terbanyak, tapi juga hikmat kebijaksanaan dan musyawarah mufakat (sila ke-4). Kebebasan tidak boleh bertentangan dengan nilai Ketuhanan, kemanusiaan, persatuan, dan keadilan sosial.`,
  `<b>Tantangan:</b> politik uang, korupsi, dan oligarki membuat prinsip "untuk rakyat" belum sepenuhnya terwujud. Karena itu warga, termasuk mahasiswa, perlu ikut mengawasi secara kritis.`
 ],vis:()=>[V.cols('Of, by, for the people',[['Dari rakyat','Kekuasaan bersumber dari rakyat'],['Oleh rakyat','Rakyat ikut menjalankan, misal lewat pemilu'],['Untuk rakyat','Tujuannya kesejahteraan rakyat']])]}
],
pk:[
 {id:'pk1',t:'Pengantar perilaku konsumen',gist:'Perilaku konsumen adalah ilmu tentang bagaimana orang memutuskan membeli, memakai, dan menilai sesuatu, mulai dari sebelum beli sampai sesudahnya.',pts:[
  `<b>Beda "pembeli" dan "konsumen".</b> Dulu yang dipelajari hanya saat bayar di kasir. Sekarang dilihat sebagai proses panjang: <b>sebelum beli</b> (sadar butuh, cari info, baca review), <b>saat beli</b> (pengalaman belanja, tampilan aplikasi, kemudahan checkout), <b>sesudah beli</b> (puas, kasih bintang 5, rekomendasi, atau kecewa dan komplain). ${e('kamu cari promo di e-commerce, checkout, lalu menulis review: itu satu rangkaian')}`,
  `<b>Definisi:</b> studi tentang cara individu, kelompok, dan organisasi memilih, membeli, memakai, dan menilai produk, jasa, atau ide untuk memenuhi kebutuhan dan keinginan. Buat desainer: desain adalah stimulus (rangsangan) yang direspons konsumen.`,
  `<b>Lima era cara pandang pemasaran:</b>
   <br>1. <b>Produksi (1910-an):</b> fokus membuat murah dan banyak. Henry Ford: pilih warna apa saja asal hitam.
   <br>2. <b>Produk (1930-an):</b> fokus membuat fitur terbaik, tapi lupa apa yang sebenarnya dibutuhkan orang (marketing myopia).
   <br>3. <b>Penjualan (1950-an):</b> mendorong jual apa yang sudah dibuat, bukan membuat apa yang diinginkan pasar.
   <br>4. <b>Pemasaran (1950-an sampai kini):</b> mulai dari kebutuhan konsumen yang belum terpenuhi.
   <br>5. <b>Pemasaran kemasyarakatan (kini):</b> memuaskan konsumen sambil menjaga kesejahteraan masyarakat. ${e('merek yang transparan soal keberlanjutan lingkungan')}`,
  `<b>Web 2.0 dan Big Data.</b> Dulu iklan satu arah (perusahaan ke audiens), sekarang dua arah. Konsumen dapat banyak info dan produk yang sesuai selera. Pemasar dapat data: klik, lokasi, preferensi. Harga yang dibayar konsumen adalah privasi.`,
  `<b>UGC (User-Generated Content):</b> konten buatan konsumen, seperti review, video unboxing, dan keluhan viral. Sering lebih dipercaya daripada iklan yang mahal. Konsumen jadi ko-kreator dan menuntut merek yang jujur (brand authenticity).`,
  `<b>Empat ilmu yang dipakai untuk memahami konsumen:</b> psikologi (isi kepala individu: persepsi, motivasi, kepribadian, memori), sosiologi (pengaruh kelompok, kelas sosial, FOMO), antropologi (budaya, ritual, subkultur), komunikasi (simbol, bujukan, penyampaian pesan).`
 ],ingat:'Urutan evolusi: Produksi, Produk, Penjualan, Pemasaran, Kemasyarakatan.',vis:()=>[V.flow('Alur keputusan konsumen',['Sadar butuh','Cari info','Bandingkan','Beli','Evaluasi']),V.cols('Empat ilmu di baliknya',[['Psikologi','Pikiran individu'],['Sosiologi','Kelompok, FOMO'],['Antropologi','Budaya, ritual'],['Komunikasi','Pesan dan bujukan']])]},
 {id:'pk2',t:'Motivasi: dasar',gist:'Orang membeli karena ada "jarak" antara keadaan sekarang dan keadaan yang diinginkan. Jarak itu bikin tidak nyaman, lalu mendorong kita bertindak.',pts:[
  `<b>Alur motivasi:</b> ada kesenjangan, muncul ketegangan, terdorong bertindak, melakukan pembelian, lalu lega. ${e('HP lemot (kenyataan) padahal ingin lancar (harapan), jadi gelisah, cari HP baru, beli, lalu tenang')}`,
  `<b>Kebutuhan biogenik</b> adalah kebutuhan bawaan untuk bertahan hidup (lapar, haus). <b>Kebutuhan psikogenik</b> dipelajari dari lingkungan (harga diri, gengsi, kasih sayang, kekuasaan, pencapaian).`,
  `<b>Utilitarian</b> artinya membeli karena fungsi dan logika. <b>Hedonik</b> artinya membeli karena rasa dan emosi. ${e('beli motor karena irit (utilitarian) lawan karena suara dan gayanya keren (hedonik)')}`,
  `<b>Approach</b> artinya terdorong mendekati sesuatu yang positif (olahraga supaya sehat). <b>Avoidance</b> artinya terdorong menghindari sesuatu yang negatif (olahraga supaya tidak sakit).`,
  `<b>Tiga konflik motivasi:</b>
   <br>1. <b>Approach-approach:</b> memilih dua hal yang sama-sama diinginkan. Pemasar menonjolkan keunggulan satu pilihan.
   <br>2. <b>Approach-avoidance:</b> mau tapi takut akibatnya, misal ingin makanan manis tapi takut gemuk. Solusi pemasar: kompromi seperti pemanis rendah kalori.
   <br>3. <b>Avoidance-avoidance:</b> terjebak di dua pilihan buruk, misal membiarkan mobil rusak atau mengambil kredit mahal. Pemasar meminimalkan rasa sakitnya.`,
  `<b>Disonansi kognitif:</b> rasa ragu dan tidak nyaman setelah membeli barang mahal ("jangan-jangan salah beli"). Orang lalu mencari pembenaran. Pemasar membantu lewat panduan pemakaian, pesan yang meyakinkan, dan layanan pelanggan.`,
  `<b>Tujuh cara orang menghadapi frustrasi</b> (saat gagal mencapai tujuan):
   <br>1. <b>Agresi:</b> marah, misalnya memboikot merek.
   <br>2. <b>Rasionalisasi:</b> mencari alasan ("aku kurang latihan" atau "skor tinggi tidak penting kok").
   <br>3. <b>Regresi:</b> bertingkah kekanak-kanakan, misal rebutan barang diskon.
   <br>4. <b>Withdrawal:</b> mundur dari situasi.
   <br>5. <b>Proyeksi:</b> menyalahkan benda atau orang lain.
   <br>6. <b>Daydreaming:</b> melamun tentang hidup yang lebih baik.
   <br>7. <b>Identifikasi:</b> merasa diwakili orang atau iklan, lalu memakai solusi yang ditawarkan.`
 ],ingat:'Tujuh defense: Agresi, Rasionalisasi, Regresi, Withdrawal, Proyeksi, Daydreaming, Identifikasi.',vis:()=>[V.flow('Siklus motivasi',['Ada jarak','Tegang','Terdorong','Beli','Lega'])]},
 {id:'pk2b',t:'Motivasi: teori dan keterlibatan',gist:'Tiga teori terkenal yang menjelaskan apa sebenarnya yang kita cari saat membeli, plus soal seberapa peduli kita pada sebuah produk.',pts:[
  `<b>Maslow:</b> kebutuhan manusia bertingkat. Pemenuhan dimulai dari bawah.
   <br>1. Fisiologis: makan, minum, tidur.
   <br>2. Keamanan: perlindungan, stabilitas (misal asuransi).
   <br>3. Sosial: diterima, punya teman (misal nongkrong).
   <br>4. Ego/esteem: status dan percaya diri (misal barang bermerek).
   <br>5. Aktualisasi diri: sukses dan mewujudkan potensi.
   <br>Satu produk bisa memuaskan kelimanya, contoh berkebun: dapat makanan, rasa aman, hasil panen untuk dibagi, keindahan, dan ketenangan batin.`,
  `<b>McClelland (kebutuhan yang dipelajari):</b> kebutuhan akan <b>pencapaian</b> (ingin sukses), <b>kekuasaan</b> (mengendalikan lingkungan), <b>afiliasi</b> (ingin diterima kelompok dan takut ditolak), dan <b>keunikan</b> (ingin menunjukkan identitas pribadi).`,
  `<b>Freud:</b> pikiran punya tiga bagian. <b>Id</b> ingin puas sekarang tanpa peduli akibat. <b>Superego</b> adalah hati nurani dan rem moral. <b>Ego</b> jadi wasit di antara keduanya. ${e('Id ingin dessert mahal sekarang, Superego bilang jangan boros, Ego memilih porsi kecil')} Produk dibeli sebagai kompromi yang bisa diterima secara sosial.`,
  `<b>Mood dan emotion.</b> Mood adalah perasaan ringan dan sementara, iklan lebih dinilai positif saat kita sedang senang (mood congruency). Emotion adalah reaksi kuat karena pemicu yang jelas. Strategi: negative state relief (berdonasi supaya mood membaik) dan sadvertising (iklan sedih yang menguras air mata).`,
  `<b>Involvement (keterlibatan)</b> adalah seberapa penting dan relevan sebuah produk bagi konsumen. Rendah: beli karena kebiasaan (inersia). Tertinggi: fanatik, produk jadi bagian identitas (produk kultus, misal kolektor sneakers).`,
  `<b>Tiga cara pemasar menaikkan keterlibatan:</b> lewat <b>produk</b> (risiko yang dirasakan, boleh mendesain sendiri), lewat <b>pesan</b> (cerita yang menyedot perhatian, visual mengejutkan), dan lewat <b>situasi</b> (rekomendasi real-time, toko yang jadi pengalaman).`
 ],vis:()=>[
  V.pyr('Hierarki kebutuhan Maslow',[['Aktualisasi diri','Sukses, kuasa',44],['Ego (esteem)','Status, percaya diri',58],['Sosial','Dihormati, berteman',72],['Keamanan','Perlindungan, stabilitas',86],['Fisiologis','Air, tidur, makanan',100]]),
  V.g2('Matriks motivasi dan keterlibatan',{x:['Motivasi rendah','Motivasi tinggi'],y:['Peduli tinggi','Peduli rendah'],c:[
   ['Pencari nilai','Butuh rendah, tapi teliti banding harga dan cari diskon'],['Evangelis merek','Butuh tinggi dan peduli: loyal, rela bayar lebih'],['Inersia','Beli yang itu-itu saja, autopilot'],['Impulsif','Beli cepat demi kepuasan sesaat']]})]},
 {id:'pk3',t:'Persepsi: dari stimulus ke ingatan',gist:'Persepsi adalah cara otak memilih dan memaknai rangsangan. Konsumen melihat versinya sendiri, bukan kenyataan apa adanya.',pts:[
  `<b>Banjir rangsangan.</b> Di swalayan modern ada lebih dari 30.000 produk yang bersaing mencari perhatian. Otak menyaring sebagian besar supaya tidak kelelahan. Tugas pemasar: bagaimana pesan bisa lolos dari saringan itu.`,
  `<b>Lima tahap persepsi:</b>
   <br>1. <b>Paparan:</b> stimulus mulai terdeteksi.
   <br>2. <b>Perhatian:</b> lolos dari saringan, mulai diperhatikan.
   <br>3. <b>Pemahaman:</b> konsumen menafsirkan maknanya.
   <br>4. <b>Penerimaan:</b> pesan berhasil memengaruhi.
   <br>5. <b>Retensi:</b> tersimpan di ingatan.`,
  `<b>Pemasaran lewat lima indra:</b> <b>penglihatan</b> (warna cerah membangkitkan gairah, warna dingin menenangkan), <b>pendengaran</b> (tempo musik lambat membuat orang betah lama di toko), <b>penciuman</b> (aroma terhubung dengan emosi dan memori, misal aroma kopi), <b>pengecapan</b> (rasa), <b>sentuhan</b> (pembeli yang boleh menyentuh produk jadi lebih yakin menilai).`,
  `<b>Hukum Weber dan JND (just noticeable difference).</b> JND adalah perubahan terkecil yang bisa disadari. Semakin besar nilai awal, semakin besar perubahan yang dibutuhkan agar terasa. ${e('turun Rp 600 dari harga Rp 6.000 (10%) terasa, tapi turun Rp 600 dari Rp 60.000 (1%) tidak terasa')}
   <br><b>Di bawah JND</b> = sengaja tidak terasa: kemasan dikecilkan diam-diam, atau logo diperbarui sedikit demi sedikit supaya pelanggan tidak kaget.
   <br><b>Di atas JND</b> = sengaja terasa: diskon cukup besar (minimal sekitar 20%) atau fitur baru yang jelas terlihat.`,
  `<b>Perceptual vigilance:</b> otak memperhatikan hal yang relevan dengan kebutuhan kita saat ini (lapar, jadi mudah melihat iklan makanan). <b>Perceptual defense:</b> otak menolak hal yang mengancam (perokok mengabaikan gambar peringatan di bungkus rokok).`,
  `<b>Cara menembus saringan lewat kontras:</b> <b>ukuran</b> (jauh lebih besar dari sekitar), <b>warna</b> (berbeda dari lingkungan), <b>posisi</b> (di tempat tak terduga, misal ambient media di jalan), <b>kebaruan</b> (menyimpang dari yang diharapkan, ada kejutan).`
 ],ingat:'Mau diam-diam, tetap di bawah JND. Mau ketahuan, lewati JND.',vis:()=>[V.flow('Perjalanan stimulus',['Paparan','Perhatian','Pemahaman','Penerimaan','Retensi'])]},
 {id:'pk3b',t:'Persepsi: makna dan risiko',gist:'Setelah stimulus ditangkap, otak menyusun maknanya sendiri, sering lewat jalan pintas. Ini yang membentuk penilaian konsumen terhadap sebuah merek.',pts:[
  `<b>Psikologi Gestalt:</b> otak menyatukan potongan menjadi pola yang bermakna.
   <br>1. <b>Figure-ground:</b> yang menonjol (figure) jadi fokus, sisanya jadi latar. ${e('iklan yang dibuat jelas fokusnya supaya tidak diabaikan')}
   <br>2. <b>Closure:</b> otak otomatis melengkapi gambar atau pesan yang tidak utuh. ${e('teaser poster yang sengaja dibuat setengah')}
   <br>3. <b>Grouping:</b> benda yang berdekatan atau mirip dianggap satu kelompok. ${e('produk ditata dengan gaya target pasarnya')}`,
  `<b>Semiotika:</b> ilmu tentang tanda dan makna. Ada tiga bagian: tanda atau simbol, objek (produk), dan makna di benak konsumen (interpretant). ${e('karakter koboi (tanda) dipasang pada rokok Marlboro (objek) menghasilkan kesan maskulin dan tangguh (makna)')} Merek kuat menjual maknanya, bukan hanya fiturnya.`,
  `<b>Tiga bias penilaian:</b>
   <br>1. <b>Kesan pertama</b> bersifat awet. Meluncurkan produk yang belum matang bisa fatal.
   <br>2. <b>Stereotyping:</b> menilai dari isyarat sederhana seperti penampilan, istilah, atau negara asal produk.
   <br>3. <b>Halo effect:</b> satu hal bagus membuat keseluruhan dinilai bagus. Ini dasar brand extension dan licensing.`,
  `<b>Isyarat intrinsik</b> adalah atribut fisik produk (rasa, tekstur, warna, ukuran), sulit dinilai sebelum membeli. <b>Isyarat ekstrinsik</b> adalah hal di luar produk (harga, citra merek, reputasi toko, kemasan), dipakai sebagai jalan pintas saat orang tidak punya waktu atau keahlian. Kemasan ibarat billboard mini di rak toko. ${e('isi pemanis yang sama bisa terasa beda kalau kemasannya diubah dari minimalis menenangkan menjadi vibran dan ceria')}`,
  `<b>Risiko yang dirasakan (perceived risk)</b> dan solusi pemasar:
   <br>1. <b>Fungsional/fisik</b> ("bekerja dan aman tidak?"): edukasi, garansi uang kembali, sampel gratis.
   <br>2. <b>Finansial</b> ("sepadan dengan harganya?"): harga yang menandakan kualitas dan reputasi toko.
   <br>3. <b>Psikologis/sosial</b> ("kata orang gimana?"): brand loyalty, endorsement, merek yang cocok dengan identitas target.`,
  `<b>Positioning</b> adalah posisi merek di pikiran konsumen, bukan apa yang dilakukan pada produk. Dipetakan lewat perceptual mapping, misal sumbu ekonomis lawan premium dan tradisional lawan trendi.`
 ],vis:()=>[V.cols('Tiga risiko dan solusinya',[['Fungsional/fisik','Garansi, sampel gratis'],['Finansial','Harga sinyal kualitas, toko terpercaya'],['Sosial/psikologis','Endorser, loyalitas merek']])]},
 {id:'pk4',t:'Konsep diri',gist:'Konsep diri adalah gambaran tentang "aku ini siapa". Banyak pembelian dilakukan untuk membentuk atau menunjukkan gambaran itu.',pts:[
  `<b>Tiga sisi konsep diri:</b> <b>isi</b> (atribut yang dimiliki, misal pintar atau menarik secara fisik), <b>positivitas</b> (seberapa tinggi menilai diri, atau self-esteem), <b>akurasi</b> (seberapa sesuai dengan kenyataan, sering terdistorsi filter media sosial).`,
  `<b>Empat teori pembentukan konsep diri:</b> self-appraisal (diterima atau ditolak masyarakat), reflected appraisal atau looking-glass self (terbentuk dari penghargaan orang lain), social comparison (membandingkan diri dengan orang lain), biased scanning (cara pandang terhadap lingkungan).`,
  `<b>Looking-glass self:</b> kita menampilkan diri (outfit, gaya hidup, opini), masyarakat merespons (perhatian, pujian, like), lalu kita menyesuaikan diri. Orang yang self-monitoring-nya tinggi lebih mungkin membeli sesuatu demi menghindari malu di depan umum.`,
  `<b>Perspektif dramaturgical:</b> hidup seperti teater, kita aktor dengan banyak peran dan produk adalah propertinya. ${e('peran mahasiswa rajin (kacamata anti-radiasi, MacBook, kopi), peran eco-warrior (tote bag, tumbler, transportasi umum)')}`,
  `<b>Extended self:</b> barang yang kita miliki dianggap bagian dari diri, di empat level: individu (pakaian, ponsel), keluarga (rumah, furnitur), komunitas (lingkungan, kota asal), grup (fandom, almamater, tim olahraga). <b>Enclothed cognition:</b> makna pakaian memengaruhi perilaku pemakainya. <b>Posing power:</b> postur tubuh memengaruhi perasaan.`,
  `<b>Pergeseran gender:</b> dari sex-typed marketing (pink lawan biru, label "for men" dan "for women") ke androgyny dan fluiditas (palet unisex, kosmetik pria, label gender dihapus). Ada juga produk gender-bending, misalnya kosmetik pria atau senjata dengan warna pink untuk wanita.`,
  `<b>Body image:</b> standar cantik dibentuk budaya dan berbeda di tiap negara (Global Photoshop Project membuktikan itu). Pemasar memanfaatkan celahnya lewat <b>vanity sizing</b> (label ukuran dibuat lebih kecil dari aslinya supaya pembeli senang) dan <b>social comparison trap</b> (melihat model dan influencer terus-menerus menurunkan kepuasan pada tubuh sendiri lalu memicu belanja). Sisi gelapnya: obsesi berlebihan sampai bedah plastik.`
 ],ingat:'Empat versi diri: actual, ideal, social, ideal social. Ditambah avoidance self (diri yang tidak diinginkan).',vis:()=>[V.g2('Empat versi diri',{x:['Realita','Aspirasi'],y:['Mata saya','Mata orang'],c:[['Actual self','Diri saya yang sebenarnya'],['Ideal self','Diri yang ingin saya jadi'],['Social self','Saya merasa orang melihat saya begini'],['Ideal social self','Saya ingin orang melihat saya begini']]}),`<p class="note"><b>Avoidance self:</b> siapa yang tidak kamu inginkan. Contoh: sengaja makan junk food untuk memberontak dari identitas sehat.</p>`]},
 {id:'pk5',t:'Personality, lifestyle, value',gist:'Demografi hanya menjawab SIAPA yang membeli. Personality, lifestyle, dan value menjawab MENGAPA mereka membeli.',pts:[
  `<b>Contoh kenapa perlu:</b> dua mahasiswa sama-sama umur 20 dan uang jajan Rp 2 juta bisa memilih barang yang sangat berbeda. Perbedaannya ada di nilai hidup (values), cara memakai waktu dan uang (lifestyle), dan cara berpikir (personality).`,
  `<b>Teori Freud untuk pemasaran:</b> motif bawah sadar (konsumen sering tidak bisa menjelaskan alasan asli belinya), simbolisasi produk (kompromi Id dan Superego), dan riset motivasi yang dipopulerkan Dr. Ernest Dichter pada 1950-an.`,
  `<b>Neo-Freudian, Karen Horney (model CAD):</b> <b>Compliant</b> ingin dicintai dan diterima. <b>Aggressive</b> ingin menang, berprestasi, berstatus. <b>Detached</b> ingin mandiri dan bebas dari aturan kelompok.`,
  `<b>Carl Jung dan brand personality:</b> kita memilih merek yang mencerminkan diri kita. Rebel (Harley-Davidson, Vans), Creator (Apple, Lego), Hero (Nike), Jester (Old Spice, M&amp;Ms, Skittles), Lover (Chanel, Godiva).`,
  `<b>Trait theory, Big Five (OCEAN):</b>
   <br>1. <b>Openness:</b> suka hal baru, misal edisi terbatas.
   <br>2. <b>Conscientiousness:</b> teliti, riset berhari-hari, beli yang awet.
   <br>3. <b>Extroversion:</b> belanja untuk nongkrong, rentan FOMO.
   <br>4. <b>Agreeableness:</b> loyal pada merek ramah lingkungan atau punya misi sosial.
   <br>5. <b>Neuroticism:</b> retail therapy, belanja impulsif saat stres.`,
  `<b>Kerangka Aaker (5 dimensi kepribadian merek):</b> Sincerity (tulus), Excitement (energik), Competence (andal), Sophistication (elegan), Ruggedness (tangguh).`,
  `<b>Lifestyle:</b> orang jarang membeli barang terpisah, melainkan satu paket pelengkap (product constellation), misalnya starter pack "anak senja": tote bag, kopi slow bar, kamera analog, musik folk. Co-branding menggabungkan dua merek agar maknanya saling menular.`,
  `<b>Psikografis</b> (mengapa mereka membeli) melengkapi demografi (siapa mereka). Alatnya <b>AIO</b>: Activities (apa yang dilakukan), Interests (apa yang menarik perhatian), Opinions (pandangan tentang dunia). Hasilnya dipakai menyusun buyer persona.`,
  `<b>VALS:</b> Thinkers (fokus ide dan fungsi), Achievers (karier dan status), Makers (praktis, DIY), Experiencers (impulsif, suka pengalaman, target pasar Gen Z).`,
  `<b>Nilai inti dan means-end chain:</b> kita sebenarnya membeli tujuan akhir. ${e('sepatu lari ultralight (produk), sol empuk (atribut), kaki tidak sakit dan bisa lari jauh (manfaat), kesehatan dan kebebasan (nilai inti)')}`,
  `<b>Tren nilai:</b> bergeser dari materialisme (status = banyak barang mewah, fast fashion) ke minimalisme dan pengalaman (decluttering, konser dan traveling, thrifting, produk ramah lingkungan).`
 ],ingat:'Singkatan: CAD (Horney), OCEAN (Big Five), AIO (psikografis).',vis:()=>[V.cols('Horney: model CAD',[['Compliant','Ingin dicintai dan diterima'],['Aggressive','Ingin menang dan berstatus'],['Detached','Ingin mandiri dan bebas']]),V.cols('Aaker: 5 dimensi merek',[['Sincerity','Tulus, hangat, jujur'],['Excitement','Energik, berani'],['Competence','Andal, cerdas'],['Sophistication','Elegan, berkelas'],['Ruggedness','Tangguh, outdoorsy']])]},
 {id:'pk6',t:'Consumer learning',gist:'Konsumen belajar dari pengalaman, sering tanpa sadar. Merek memanfaatkannya untuk melatih kebiasaan beli kita.',pts:[
  `<b>Apa itu consumer learning?</b> Proses mendapat pengetahuan dan pengalaman belanja, lalu memakainya untuk membentuk perilaku di masa depan. Bisa sengaja (riset berhari-hari sebelum beli laptop) atau tidak sengaja (hafal jingle iklan mi instan karena sering lewat di timeline).`,
  `<b>Empat elemen utama:</b>
   <br>1. <b>Motives:</b> kebutuhan atau masalah yang belum terpenuhi.
   <br>2. <b>Cues:</b> petunjuk dari luar (iklan, kemasan, harga) yang mengarahkan dorongan.
   <br>3. <b>Responses:</b> reaksi kita (klik add to cart, beli, atau mengabaikan).
   <br>4. <b>Reinforcement:</b> hadiah atau kepuasan. Kalau puas, kita mengulang siklusnya.`,
  `<b>Kasus Febreze.</b> Awalnya gagal karena dijual sebagai penghilang bau (orang jarang sadar rumahnya bau). Setelah diposisikan sebagai hadiah wangi setelah selesai bersih-bersih, penjualannya meledak.`,
  `<b>Dua mazhab:</b> <b>behavioral</b> (insting, merespons stimulus secara otomatis, cocok untuk sabun, camilan) dan <b>cognitive</b> (berpikir, memproses informasi, cocok untuk laptop, mobil, asuransi).`,
  `<b>Classical conditioning:</b> belajar lewat asosiasi dan pengulangan, seperti anjing Pavlov yang mengeluarkan air liur saat mendengar bel. ${e('iklan Avocados from Mexico terus mengaitkan alpukat dengan lemak baik dan gaya hidup sehat, sampai otak otomatis menganggap makan alpukat sama dengan sehat')}`,
  `<b>Stimulus generalization dan discrimination.</b> Generalization (strategi me-too): pesaing sengaja meniru kemasan brand leader supaya konsumen menyamakan kualitasnya. Discrimination: leader tampil beda supaya tidak tertukar, misal Apple dengan kampanye "Think Different".`,
  `<b>Instrumental conditioning:</b> belajar dari konsekuensi (coba-coba lalu dapat hadiah). Positive reinforcement berupa diskon, poin loyalitas, atau pujian teman. <b>Shaping:</b> memberi hadiah sebelum perilaku utama terjadi. ${e('bonus saldo Rp 50.000 saat pertama kali mengunduh aplikasi e-commerce, supaya kamu mau mencoba belanja')}`,
  `<b>Observational learning:</b> belajar dengan mengamati orang lain (modeling). ${e('anak-anak melihat atlet makan sereal Wheaties lalu ikut makan; kamu menonton review skincare beauty vlogger lalu langsung checkout')}`,
  `<b>Involvement dan otak:</b> high involvement/thinking (mobil, laptop): riset dan baca review. High involvement/feeling (gaun pengantin, parfum mewah): emosi dan ego terlibat. Low involvement (tisu, sampo): kebiasaan, pilih merek yang paling sering dilihat. <b>Otak kiri</b> memproses teks, angka, logika. <b>Otak kanan</b> memproses gambar, warna, musik (passive learning seperti menonton TV).`,
  `<b>Hasil akhir:</b> brand loyalty (pelanggan setia yang menolak pindah meski pesaing kasih diskon) dan brand equity (nilai merek di otak konsumen, alasan orang rela bayar lebih mahal untuk iPhone).`
 ],ingat:'Empat elemen: Motives, Cues, Responses, Reinforcement. Tiga jenis belajar: Classical, Instrumental, Observational.',vis:()=>[V.flow('Mesin pembelajaran',['Motive','Cue','Response','Reinforcement']),V.cols('Tiga jenis belajar',[['Classical','Asosiasi (jingle, Pavlov)'],['Instrumental','Hadiah (diskon, poin)'],['Observational','Meniru (review, endorser)']])]}
],
idn:[
 {id:'idn0',t:'Peta UTS (dari RPS)',gist:'UTS Inovasi Design Nusantara itu ujian tertulis di kelas. Yang diuji: kamu bisa mengenali, menganalisis, dan menerapkan elemen budaya lokal Nusantara dalam desain.',pts:[
  `<b>Cakupan = minggu 1–7 di RPS:</b> (1) konsep kekayaan budaya Nusantara, (2) sejarah budaya lokal, (3) motif dan simbol, (4) warna dan bentuk tradisional, (5) integrasi budaya ke desain, (6) metodologi penelitian budaya, (7) eksperimen cipta desain.`,
  `<b>Bobot:</b> UTS 20%, UAS 25%, Proyek 30%, Tugas 1 dan 2 masing-masing 10% dan 15%. Jadi UTS lumayan, tapi bukan segalanya.`,
  `<b>Cara pakai halaman ini:</b> baca 7 topik di bawah dari atas ke bawah. Slide dosen jadi sumber utama. Kata kunci per topik ada di kotak "Ingat" paling bawah.`,
  `<b>Catatan jujur:</b> beberapa slide (motif tiap daerah, gambar) isinya foto saja, tidak ada teks. Itu tidak bisa kubaca, jadi lihat langsung slide aslinya untuk gambar-gambarnya.`
 ],ingat:'UTS = tertulis di kelas, minggu 1–7. Kata kerja kunci: identifikasi, analisis, terapkan.'},
 {id:'idn1',t:'Tugas IDN Project',gist:'Tugas besar mata kuliah ini: ambil budaya Indonesia, lalu olah jadi karya desain baru.',pts:[
  `<b>Tugas UTS:</b> pilih satu cerita rakyat Indonesia. Pelajari latar belakangnya, lalu kembangkan visualnya dan buat desain karakter. Hasil jadi boleh berupa <b>poster ilustrasi, animasi sederhana, fotografi, atau video pendek</b>.
   ${e('cerita rakyat Malin Kundang jadi seri poster ilustrasi, dengan karakter Malin yang digambar ulang secara modern.')}`,
  `<b>Tugas UAS:</b> pilih produk lokal untuk di-<b>rebranding</b>. Pelajari latar belakangnya, lalu buat desain pemasarannya dengan konsep budaya Indonesia.
   ${e('keripik tempe di sebuah kota dibuat ulang kemasan dan logonya dengan motif batik daerah itu.')}`,
  `<b>Rebranding</b> artinya mengubah wajah merek (logo, warna, kemasan) agar lebih segar atau lebih mengena, tanpa membuang jati dirinya.`
 ],ingat:'UTS = cerita rakyat jadi visual. UAS = rebranding produk lokal. Bentuk hasil: poster ilustrasi, animasi, foto, video.',
  vis:()=>[V.cols('Dua tugas besar',[['Tugas UTS','Cerita rakyat → karakter visual → poster / animasi / foto / video'],['Tugas UAS','Produk lokal → rebranding → desain pemasaran berbudaya'],['Intinya','Budaya Indonesia jadi sumber ide desain modern']])]},
 {id:'idn2',t:'Budaya visual prasejarah',gist:'Seni paling awal manusia ada di dinding gua. Dari situ muncul gambar, kepercayaan, dan akhirnya budaya serta aturan hidup bersama.',pts:[
  `<b>Kenapa manusia purba berkesenian?</b> Untuk memenuhi kebutuhan <b>rohani</b>, bukan sekadar hiasan.`,
  `<b>Karya awal = lukisan di dinding gua.</b> Objeknya <b>hewan buruan</b>, karena itu penentu hidup mereka.`,
  `<b>Lalu gambar manusia.</b> Kalau mulai menggambar manusia, artinya cara berpikir mereka sudah berkembang.`,
  `<b>Dari keluarga ke masyarakat:</b> mikir soal pernikahan dan keturunan → keluarga → beberapa keluarga jadi <b>perkampungan</b> → memilih <b>kepala suku / kepala adat</b>.`,
  `<b>Lahir karya budaya:</b> aturan atau hukum (teks) dan benda (kebendaan). Ada ritual keagamaan: <b>animisme</b> (percaya roh pada benda dan alam) dan <b>dinamisme</b> (percaya benda punya kekuatan gaib).`,
  `<b>Alat kebendaan:</b> kapak, tombak, periuk, dan sebagainya.`
 ],ingat:'Urutan: lukisan gua (hewan) → gambar manusia → keluarga → kampung → kepala adat → aturan + ritual (animisme, dinamisme).',
  vis:()=>[V.flow('Dari gua sampai budaya',['Lukis hewan buruan','Gambar manusia','Keluarga','Kampung','Kepala adat','Aturan dan ritual'])]},
 {id:'idn3',t:'10 elemen desain tradisional Nusantara',gist:'Ada 10 "bahan baku" visual dari budaya Nusantara yang bisa dipakai di DKV: dari motif sampai filosofi.',pts:[
  `<b>Cara hafal:</b> tiap elemen punya dua sisi, apa itu dan buat apa di DKV. Intinya selalu: beri identitas budaya, boleh disederhanakan agar modern.`,
  `<b>1. Motif dan ornamen:</b> batik, ukir, tenun, anyaman. Contoh kawung, parang. Pakai untuk poster, branding, kemasan.`,
  `<b>2. Warna tradisional:</b> warna bermakna simbol. Merah = keberanian, hijau = kesuburan, emas = kemuliaan.`,
  `<b>3. Tipografi dan aksara:</b> Jawa (Hanacaraka), Bali, Sunda, Batak. Bisa jadi logo atau font modern.`,
  `<b>4. Simbol dan ikonografi:</b> Garuda Pancasila, kala, simbol spiritual. Wajib paham maknanya supaya tidak salah tafsir.`,
  `<b>5. Bentuk dan siluet:</b> rumah adat, keris, gamelan. Cocok untuk logo dan ilustrasi karena mudah dikenali.`,
  `<b>6. Tekstur dan pola:</b> anyaman, tenun, ukiran kayu. Jadi latar atau hiasan, cocok untuk kemasan.`,
  `<b>7. Tata letak dan komposisi:</b> wayang kulit, relief candi. Susunannya seimbang dan bermakna, bisa dipakai untuk layout poster atau antarmuka digital.`,
  `<b>8. Cerita dan narasi visual:</b> relief candi, wayang, lukisan tradisional. Dipakai di ilustrasi, komik, animasi, kampanye sosial.`,
  `<b>9. Material dan teknik tradisional:</b> kayu, kain, logam; teknik batik, ukir, tenun. Efeknya bisa ditiru digital agar terasa handmade.`,
  `<b>10. Nilai dan filosofi budaya:</b> harmoni, keseimbangan, hubungan manusia dengan alam. Bisa jadi konsep utama desain.`
 ],ingat:'Singkatan bantu: Motif, Warna, Aksara, Simbol, Bentuk, Tekstur, Tata letak, Narasi, Material, Nilai (10 elemen).',
  vis:()=>[V.table('Ringkasan 10 elemen',['#','Elemen','Contoh','Dipakai untuk'],[['1','Motif dan ornamen','kawung, parang','poster, branding, kemasan'],['2','Warna','merah, hijau, emas','kesan budaya, branding'],['3','Aksara','Hanacaraka, Bali','logo, font'],['4','Simbol','Garuda, kala','logo, ikon'],['5','Bentuk dan siluet','rumah adat, keris','logo, ilustrasi'],['6','Tekstur dan pola','anyaman, tenun','latar, kemasan'],['7','Tata letak','wayang kulit, relief','layout poster, UI'],['8','Narasi visual','relief candi, wayang','komik, animasi'],['9','Material dan teknik','batik, ukir, tenun','tampilan handmade'],['10','Nilai dan filosofi','harmoni, keseimbangan','konsep desain']])]},
 {id:'idn4',t:'Desain inovatif',gist:'Desain inovatif = merancang produk atau sistem baru dengan menggabungkan ide kreatif dan kebutuhan pengguna.',pts:[
  `<b>Peran:</b> memadukan teknologi, kreativitas, dan pemahaman pengguna untuk solusi yang lebih efisien, berkelanjutan, dan manusiawi.`,
  `<b>5 jenis (dengan contoh dari slide):</b>
   <br>1. <b>Produk:</b> smartphone pintar, mobil listrik ramah lingkungan.
   <br>2. <b>Layanan:</b> aplikasi pengiriman makanan.
   <br>3. <b>Komunikasi:</b> iklan kreatif yang memikat perhatian konsumen.
   <br>4. <b>Lingkungan:</b> hunian ramah lingkungan, energi terbarukan, bahan daur ulang.
   <br>5. <b>Interaksi:</b> tampilan smartphone yang intuitif dan responsif.`,
  `<b>7 langkah merancang:</b> (1) penelitian mendalam, (2) generate ide, (3) perancangan konsep, (4) prototyping, (5) pengujian, (6) iterasi, (7) produksi.
   ${e('mau bikin kemasan jajanan: riset selera pembeli → 20 ide kemasan → pilih 1 konsep → bikin mockup → tes ke 10 orang → revisi → cetak massal.')}`
 ],ingat:'5 jenis: Produk, Layanan, Komunikasi, Lingkungan, Interaksi. 7 langkah: Riset, Ide, Konsep, Prototype, Uji, Iterasi, Produksi.',
  vis:()=>[V.flow('7 langkah desain inovatif',['Riset','Generate ide','Konsep','Prototyping','Pengujian','Iterasi','Produksi'])]},
 {id:'idn5',t:'Kekayaan budaya Indonesia',gist:'Budaya Indonesia kaya karena geografi, etnis, dan budayanya beragam. Slide membaginya jadi 5 kelompok.',pts:[
  `<b>1. Kesenian tradisional:</b> tari, musik, seni lukis. Contoh Tari Pendet (Bali), Tari Saman (Aceh), Reog Ponorogo (Jawa Timur).`,
  `<b>2. Kerajinan tangan:</b> batik, ukiran kayu dan batu, alat musik, patung. Bukti keahlian pengrajin.`,
  `<b>3. Bahasa dan sastra:</b> Bahasa Indonesia mengikat semua daerah. Contoh sastrawan: Pramoedya Ananta Toer.`,
  `<b>4. Adat istiadat dan ritual:</b> membentuk identitas lokal. Contoh upacara adat Toraja dan Seren Taun (Jawa Barat).`,
  `<b>5. Budaya kontemporer:</b> film, musik pop, seni rupa kontemporer, desain mode. Tradisi bertemu modern.`
 ],ingat:'5 kelompok: Kesenian, Kerajinan, Bahasa-sastra, Adat-ritual, Kontemporer. Hafal satu contoh tiap kelompok.',
  vis:()=>[V.table('Kelompok dan contohnya',['Kelompok','Contoh'],[['Kesenian','Tari Pendet, Saman, Reog'],['Kerajinan','Batik, ukiran, patung'],['Bahasa dan sastra','Bahasa Indonesia, Pramoedya'],['Adat dan ritual','Upacara Toraja, Seren Taun'],['Kontemporer','Film, musik pop, mode']])]},
 {id:'idn6',t:'Ornamen dan motif: makna dan fungsi',gist:'Ornamen = hiasan. Motif = unsur pokok ornamen, yaitu bentuk dasar yang diulang atau digubah.',pts:[
  `<b>Ornamen:</b> komponen karya seni yang sengaja ditambahkan sebagai hiasan estetis. Dari bahasa Yunani <b>ornare</b> (hiasan, perhiasan). Hakikatnya "irama" dalam garis atau bidang, atau ilmu menghias.`,
  `<b>3 fungsi ornamen:</b>
   <br>1. <b>Murni estetis:</b> memperindah. Contoh keramik, peralatan rumah.
   <br>2. <b>Simbolis:</b> menyimpan harapan, tanda, cita-cita. Biasanya di benda pusaka atau sakral.
   <br>3. <b>Estetik konstruktif:</b> memperindah sekaligus ikut membentuk konstruksi. Contoh ukiran kayu.`,
  `<b>Motif:</b> unsur pokok ornamen, dari bentuk alam atau gubahannya.`,
  `<b>6 jenis motif:</b> geometris, manusia, benda alam, khayal, tumbuhan, binatang.`,
  `<b>Deformasi dan distorsi:</b> bentuk (misalnya binatang) disederhanakan atau diubah sampai tinggal kesannya saja.
   ${e('ayam jago digambar jadi garis-garis lengkung, tapi orang masih menangkap "ini ayam".')}`,
  `<b>Motif daerah di slide:</b> Surakarta, Mataram, Jepara, Bali, Kalimantan, Papua, Toraja, Batak (isinya gambar, lihat slide asli).`
 ],ingat:'3 fungsi: estetis, simbolis, estetik-konstruktif. 6 motif: geometris, manusia, benda alam, khayal, tumbuhan, binatang.',
  vis:()=>[V.cols('3 fungsi ornamen',[['Estetis','Hanya mempercantik'],['Simbolis','Membawa harapan dan makna'],['Estetik konstruktif','Cantik dan ikut menyusun konstruksi']]),V.cols('6 jenis motif',[['Geometris','garis, segitiga, spiral'],['Manusia / binatang','figur disederhanakan'],['Alam / tumbuhan / khayal','awan, daun, makhluk mitos']])]},
 {id:'idn7',t:'Pemasaran interaktif',gist:'Konsumen tidak lagi cuma penerima iklan. Mereka ikut aktif dan menjadi rekan dalam menciptakan serta mengembangkan produk.',pts:[
  `<b>Tujuan:</b> memikat dan memelihara konsumen yang jadi rekan bisnis (menciptakan, membeli, mengembangkan produk dan layanan).`,
  `<b>2 metode:</b>
   <br><b>Pull marketing:</b> konsumen yang mencari sendiri, lewat web browser (cari, baca, unduh).
   <br><b>Push marketing:</b> informasi dikirim otomatis ke konsumen (software Web/Net Broadcaster seperti PointCast, BackWeb, Castanet), tampil sebagai banner atau screen saver.
   ${e('Pull = kamu googling harga sepatu. Push = notifikasi diskon masuk sendiri ke HP.')}`,
  `<b>3 media pemasaran interaktif:</b> (1) <b>Direct mail:</b> kirim penawaran ke alamat tertentu (surat, brosur). (2) <b>Telemarketing:</b> menawarkan lewat telepon atau telekomunikasi. (3) <b>Internet:</b> media penyampai pesan luas yang sangat memengaruhi penjualan.`,
  `<b>5 beda internet vs media massa:</b>
   <br>1. Lebih ke <b>pull</b> daripada push.
   <br>2. Memungkinkan <b>interaksi</b> (pesan lewat web, penjual menghubungi lewat telepon atau email).
   <br>3. Bisa <b>one-to-one atau many-to-many</b>, bukan hanya one-to-many. Konsumen bisa ikut menentukan desain produk (Hoffman dan Novak).
   <br>4. Mengubah standar komunikasi pemasaran: website bisa menginformasikan, membujuk, sekaligus jualan langsung (dialog).
   <br>5. Mengubah saluran distribusi dan marketplace, batas keluar-masuk perusahaan mengecil.`,
  `<b>3 elemen keefektifan:</b> <b>Encoding</b> (merancang isi pesan sesuai audiens), <b>Noise</b> (gangguan luar yang menurunkan kualitas pesan), <b>Decoding</b> (penerima menafsirkan pesan, tergantung kognisi dan lama pakai internet).`,
  `<b>3 aturan hubungan dengan konsumen:</b> (1) taruh pemasaran interaktif dalam strategi besar yang terus memberi keuntungan, (2) jaga keseimbangan tujuan perusahaan dan kebutuhan belanja konsumen, (3) cari cara agar tiap teknologi memberi banyak manfaat sekaligus.`
 ],ingat:'Pull = konsumen cari. Push = dikirim ke konsumen. Efektif bila Encoding, Noise, Decoding terkendali.',
  vis:()=>[V.g2('Pull vs Push',{x:['Pull','Push'],y:['Siapa mulai','Contoh'],c:[['Konsumen','mencari sendiri'],['Perusahaan','mengirim otomatis'],['Googling info produk','Banner / notifikasi'],['Web browser','Net broadcaster']]}),V.flow('Alur pesan',['Encoding (dibuat)','Noise (gangguan)','Decoding (ditafsir)'])]},
 {id:'idn8',t:'Multimedia interaktif',gist:'Menurut Green dan Brown, multimedia interaktif memadukan teks, grafik, audio, dan interaktivitas. Untuk menilainya, ada 6 kriteria Thorn.',pts:[
  `<b>Thorn (2006), 6 kriteria menilai multimedia interaktif:</b> (1) kemudahan navigasi, (2) kandungan kognisi, (3) presentasi informasi, (4) integrasi media, (5) artistik dan estetika, (6) fungsi secara keseluruhan.`,
  `<b>Green dan Brown, 4 unsur:</b>
   <br><b>1. Teks:</b> simbol visual untuk menjelaskan bahasa lisan. Ukuran: length (banyak teks) dan size (besar huruf; standar 10 atau 12 poin).
   <br><b>2. Grafik:</b> medium visual 2D (kertas, TV, layar), bisa realita atau ikonik. Ada gambar diam dan bergerak. Contoh ikon toilet laki-laki dan perempuan.
   <br><b>3. Audio:</b> yang didengar: narasi, lagu, sound effect, back sound.
   <br><b>4. Interaktivitas:</b> bukan medium, tapi <b>rancangan di balik program</b>. Disebut juga interface design atau human factor design.`
 ],ingat:'Thorn = 6 kriteria menilai. Green dan Brown = Teks, Grafik, Audio, Interaktivitas (interaktivitas itu rancangan, bukan medium).',
  vis:()=>[V.cols('4 unsur multimedia',[['Teks','Time New Roman, Arial; size 10-12'],['Grafik','Diam dan bergerak, 2D'],['Audio + Interaktivitas','Suara; rancangan interface']])]}

],
pack:[
 {id:'pack0',t:'Peta materi Packaging Design',gist:'Materi ini dari file Desain Kemasan: Tujuan dan Stakeholder, lalu Tugas 1 Desain Label Kemasan.',pts:[
  `<b>Isi:</b> (1) definisi dan fungsi kemasan, (2) tujuan kemasan, (3) faktor pertimbangan desain, (4) dampak ke penjualan, (5) stakeholder, (6) label kemasan.`,
  `<b>Catatan jujur:</b> yang kubaca hanya satu file (Bagian 01 dan 02 plus Tugas 1). Kalau dosen punya slide lain, cek juga.`
 ],ingat:'Urutan belajar: definisi, fungsi, tujuan, faktor, dampak, stakeholder, label.'},
 {id:'pack1',t:'Definisi dan 2 fungsi kemasan',gist:'Kemasan bukan cuma pembungkus. Ia melindungi produk dan sekaligus menjual produk.',pts:[
  `<b>Kotler dan Keller:</b> kemasan = seluruh kegiatan merancang dan memproduksi wadah atau pembungkus suatu produk.`,
  `<b>Klimchuk dan Krasovec:</b> kemasan = disiplin kreatif yang memadukan bentuk struktural, bahan, warna, citra, dan tipografi agar produk siap dipasarkan.`,
  `<b>Fungsi protektif:</b> melindungi dari cuaca, guncangan, tekanan, mikroba, dan mencegah kerugian saat distribusi.`,
  `<b>Fungsi promosional:</b> jadi <b>"silent salesperson"</b> (penjual diam) yang menarik perhatian dan mengomunikasikan identitas merek.
   ${e('mi instan dibungkus plastik tebal (protektif) dan bergambar mi yang menggugah selera (promosional).')}`
 ],ingat:'Dua fungsi: protektif + promosional ("silent salesperson").',
  vis:()=>[V.cols('2 fungsi utama',[['Protektif','Menjaga produk aman'],['Promosional','Menarik dan menjual'],['Hasilnya','Produk aman sampai ke tangan dan terjual']])]},
 {id:'pack2',t:'5 tujuan utama kemasan',gist:'Lima tujuan kemasan, dari pelindung sampai alat branding.',pts:[
  `<b>1. Barrier dan physical protection:</b> lindungi dari suhu, getaran, oksigen, uap air, debu.`,
  `<b>2. Containment dan agglomeration:</b> menyatukan benda kecil dalam satu paket agar mudah ditangani dan ditata.
   ${e('permen 100 biji dimasukkan satu toples.')}`,
  `<b>3. Information transmission:</b> cara pakai, komposisi, tanggal kedaluwarsa, identitas legal.`,
  `<b>4. Security dan theft reduction:</b> cegah akses ilegal dan pencurian, ada segel keamanan.`,
  `<b>5. Marketing dan branding:</b> desain visual untuk membujuk konsumen dan membedakan dari pesaing.`,
  `<b>3 fungsi menurut Kotler dan Keller (slide):</b> proteksi logistik (kurangi kerusakan, pembusukan, kehilangan di rantai pasok), daya tarik visual (tarik perhatian di toko, perkuat citra), komunikasi pemasaran (pesan promosi + kemudahan wadah, mendorong keputusan beli).`
 ],ingat:'5 tujuan: Barrier, Containment, Informasi, Security, Marketing.',
  vis:()=>[V.table('5 tujuan kemasan',['Tujuan','Intinya'],[['Barrier','Lindungi fisik dan iklim'],['Containment','Kumpulkan, mudah ditata'],['Information','Cara pakai, komposisi, expired'],['Security','Segel, cegah pencurian'],['Marketing','Branding dan membujuk']])]},
 {id:'pack3',t:'4 faktor pertimbangan desain',gist:'Sebelum mendesain, pikirkan 4 sisi: bahan, tampilan, kenyamanan, dan biaya serta lingkungan.',pts:[
  `<b>1. Struktural dan material:</b> kekuatan bahan (karton, plastik, kaca, metal) sesuai daya tahan yang dibutuhkan.`,
  `<b>2. Visual dan estetika:</b> warna, tipografi, logo, tata letak untuk membangun daya tarik.`,
  `<b>3. Ergonomi dan usability:</b> nyaman dipegang, dibuka, dituang, disimpan kembali.`,
  `<b>4. Ekonomi dan ekologi:</b> hemat biaya cetak dan produksi, serta ramah lingkungan (recyclability).`
 ],ingat:'4 faktor: Struktur, Visual, Ergonomi, Ekonomi-Ekologi.',
  vis:()=>[V.g2('4 faktor desain',{x:['Fisik','Persepsi'],y:['Produk','Pasar'],c:[['Struktural','bahan dan kekuatan'],['Visual','warna, logo, layout'],['Ergonomi','mudah dipakai'],['Ekonomi dan ekologi','biaya dan daur ulang']]})]},
 {id:'pack4',t:'Dampak kemasan pada penjualan',gist:'Kemasan menentukan pilihan pembeli di depan rak, dalam hitungan detik.',pts:[
  `<b>Point of purchase impact:</b> lebih dari <b>70%</b> keputusan membeli diambil langsung di depan rak toko.`,
  `<b>First moment of truth:</b> dalam <b>3 sampai 7 detik</b>, visual kemasan menentukan apakah konsumen memilih produkmu atau merek lain.`,
  `Artinya kemasan harus <b>terbaca cepat</b>: merek jelas, warna menonjol, pesan singkat.`
 ],ingat:'70% keputusan di rak. 3-7 detik = first moment of truth.',
  vis:()=>[V.flow('Di depan rak',['Lihat kemasan','3-7 detik','Putuskan beli'])]},
 {id:'pack5',t:'Stakeholder perancangan kemasan',gist:'Kemasan dibuat tim lintas disiplin: merek, desain, teknik, hukum, dan produksi.',pts:[
  `<b>Tim merek dan pemasaran:</b> <b>Brand Manager</b> (posisi produk, nilai merek, tenggat, anggaran), <b>tim pemasaran</b> (tren pasar, target audiens, diferensiasi dari pesaing), <b>riset konsumen</b> (uji konsep lewat focus group).`,
  `<b>Packaging graphic designer:</b> fokus visual: layout, warna, ilustrasi, hierarki bacaan. Kerja teknis: file siap cetak (vector artwork), <b>dieline</b> (pola potong), panduan warna <b>Pantone</b>.`,
  `<b>Structural / packaging engineer:</b> fokus fisik: bentuk 3D, kekuatan, mekanika lipatan. Kerja teknis: memilih substrat, uji ketahanan (<b>drop test</b>), efisiensi logistik.`,
  `<b>Legal dan regulatory:</b> kepatuhan regulasi: label BPOM, klaim produk, sertifikasi Halal, komposisi.`,
  `<b>Percetakan dan manufaktur:</b> produksi massal: teknik cetak (offset atau digital), toleransi warna, efisiensi biaya.`
 ],ingat:'Designer = visual dan dieline. Engineer = struktur dan drop test. Legal = BPOM dan Halal. Percetakan = cetak dan biaya.',
  vis:()=>[V.table('Siapa mengurus apa',['Pihak','Fokus'],[['Brand dan marketing','Strategi, daya tarik pasar, pesan merek'],['Packaging designer','Estetika, informasi, dieline'],['Packaging engineer','Perlindungan, kekuatan, ergonomi'],['Legal','BPOM, klaim, Halal, komposisi'],['Percetakan','Teknik cetak, warna, biaya']])]},
 {id:'pack6',t:'Tugas 1: desain label kemasan',gist:'Latihan memahami produk lalu membuat label. Langkah awal: client brief dan riset pasar, lalu aturan hukum dan anatomi label.',pts:[
  `<b>Langkah:</b> client brief dan riset pasar, lalu aturan hukum dan anatomi label (primer dan sekunder).`,
  `<b>5 komponen wajib label:</b> (1) nama produk dan merek, (2) berat bersih / netto, (3) daftar bahan / komposisi, (4) legalitas dan produsen, (5) barcode dan expired date.`
 ],ingat:'Wajib label: Nama+merek, Netto, Komposisi, Legalitas+produsen, Barcode+expired.',
  vis:()=>[V.flow('Alur tugas label',['Client brief','Riset pasar','Aturan dan anatomi label','Desain label'])]}
],
sin:[
 {id:'sin0',t:'Peta materi Sinematografi',gist:'Daftar yang kamu terima: Chiaroscuro, Cove Lighting, Rembrandt Lighting, Darren Aronofsky, Rec709/Rec2020/DCI P3, S-Log2/S-Log3, Contrast Ratio, Lift Gamma Gain.',pts:[
  `<b>Catatan jujur:</b> tidak ada slide sinematografi yang kubaca, jadi isinya dari pengetahuan umum. Angka teknis (persen warna, nilai kurva) hanya gambaran. Cocokkan dengan catatan dosen.`,
  `<b>Dikelompokkan jadi 3:</b> cahaya (chiaroscuro, cove, Rembrandt, contrast ratio), warna dan kamera (Rec709/P3/2020, S-Log), grading (Lift Gamma Gain). Plus satu sutradara (Aronofsky).`,
  `Di topik terakhir ada tabel <b>perbedaan dan persamaan</b> semuanya.`
 ],ingat:'Cahaya, Warna-kamera, Grading, Sutradara.'},
 {id:'sin1',t:'Chiaroscuro, Cove, Rembrandt (cahaya)',gist:'Tiga istilah cahaya. Chiaroscuro itu gaya kontras. Rembrandt itu cara menata satu lampu. Cove itu cara memasang lampu lembut.',pts:[
  `<b>Chiaroscuro:</b> bahasa Italia, "terang-gelap" (chiaro = terang, scuro = gelap). Gaya pencahayaan dengan kontras tajam antara area terang dan gelap, bayangan pekat dipakai untuk drama dan mood. Berakar di lukisan (Caravaggio) dan dipakai di film noir.
   ${e('wajah setengah terang, setengah gelap pekat di film detektif klasik.')}`,
  `<b>Rembrandt lighting:</b> teknik portrait dari lukisan Rembrandt. Satu lampu utama (key light) di samping depan dan agak di atas subjek (sekitar 45° ke samping dan 45° ke atas). Ciri: ada <b>segitiga cahaya kecil</b> di pipi sisi yang gelap, dan mata sisi gelap tetap kena cahaya.
   ${e('wajah tegas tapi tetap kelihatan natural, sering dipakai untuk adegan serius.')}`,
  `<b>Cove lighting:</b> lampu disembunyikan di cekungan atau rak dekat langit-langit atau dinding, lalu cahayanya memantul ke permukaan. Hasilnya cahaya <b>lembut, merata, tidak langsung</b>, tanpa bayangan keras. Biasa di interior, dan di film untuk memberi ambient lembut pada set.`,
  `<b>Perbedaan singkat:</b> Chiaroscuro = <b>hasil visual</b> yang kontras. Rembrandt = <b>cara menata</b> satu lampu (sering menghasilkan efek mirip chiaroscuro). Cove = <b>jenis sumber</b> cahaya lembut, kebalikan dari kontras keras.`,
  `<b>Persamaan:</b> ketiganya mengatur arah dan karakter cahaya untuk membentuk mood dan dimensi. Chiaroscuro dan Rembrandt sama-sama bersumber dari lukisan dan memakai bayangan.`
 ],ingat:'Chiaroscuro = terang-gelap tajam. Rembrandt = segitiga cahaya di pipi, 45°. Cove = lampu tersembunyi, pantul lembut.',
  vis:()=>[SV.lighting(),V.table('Perbandingan',['','Chiaroscuro','Rembrandt','Cove'],[['Jenis','Gaya kontras','Teknik penataan lampu','Teknik pemasangan lampu'],['Kesan','Dramatis, misterius','Serius, natural','Lembut, tenang'],['Bayangan','Pekat, luas','Ada, ada segitiga di pipi','Hampir tidak ada'],['Kontras','Tinggi','Sedang-tinggi','Rendah'],['Contoh','Film noir','Portrait / adegan serius','Interior, ruangan']])]},
 {id:'sin2',t:'Contrast ratio',gist:'Contrast ratio = seberapa besar beda terang dan gelap. Makin besar rasionya, makin dramatis gambarnya.',pts:[
  `<b>Dalam pencahayaan (lighting ratio):</b> perbandingan sisi terang (key + fill) dengan sisi gelap (fill). Contoh 4:1 berarti sisi terang 4 kali lebih terang dari sisi gelap.`,
  `<b>Dalam "stop":</b> setiap 1 stop berarti 2 kali lipat terang. Jadi 2:1 = beda 1 stop, 4:1 = 2 stop, 8:1 = 3 stop, 16:1 = 4 stop.`,
  `<b>Patokan umum:</b> 2:1 lembut dan datar (komedi, beauty). 4:1 kontras wajar. 8:1 dramatis. 16:1 atau lebih = sangat tajam seperti chiaroscuro / noir.`,
  `<b>Dalam layar:</b> contrast ratio juga dipakai untuk spesifikasi monitor, misalnya 1000:1 = putih paling terang 1000 kali lebih terang dari hitam paling gelap.`,
  `<b>Cara mengatur di set:</b> turunkan atau naikkan fill light, atau tambah reflector. Fill makin lemah, rasio makin besar.`
 ],ingat:'Rasio dobel = +1 stop. 2:1 lembut, 4:1 wajar, 8:1 dramatis, 16:1 noir.',
  vis:()=>[SV.ratio()]},
 {id:'sin3',t:'Darren Aronofsky',gist:'Sutradara Amerika yang terkenal dengan film psikologis yang intens dan gaya kamera yang "menempel" ke tokoh.',pts:[
  `<b>Siapa:</b> Darren Aronofsky, sutradara dan penulis AS. Film terkenal: <b>Pi</b> (1998), <b>Requiem for a Dream</b> (2000), <b>The Wrestler</b> (2008), <b>Black Swan</b> (2010), <b>mother!</b> (2017), <b>The Whale</b> (2022).`,
  `<b>Tema:</b> obsesi, kecanduan, tubuh dan pikiran yang hancur, psikologis yang gelap.`,
  `<b>Gaya khas:</b>
   <br>1. <b>Snorricam:</b> kamera diikat ke badan aktor sehingga wajah diam dan dunia bergoyang. Dipakai di Pi dan Requiem.
   <br>2. <b>Hip-hop montage:</b> potongan sangat cepat (close-up pendek) untuk adegan kebiasaan seperti pakai obat di Requiem.
   <br>3. <b>Close-up ekstrem dan kamera mengikuti dari belakang</b> (terutama The Wrestler dan Black Swan).
   <br>4. Visual yang menekan dan subjektif (kita ikut rasakan kondisi tokoh).`,
  `<b>Tim langganan:</b> komposer Clint Mansell, sinematografer Matthew Libatique (di sebagian besar filmnya).`
 ],ingat:'Aronofsky = psikologis intens. Ciri: Snorricam, hip-hop montage, close-up ekstrem. Film: Pi, Requiem, Black Swan, The Whale.',
  vis:()=>[SV.snorri()]},
 {id:'sin4',t:'Rec709, Rec2020, DCI-P3',gist:'Tiga standar warna: seberapa banyak warna yang boleh ditampilkan. Rec709 paling kecil, DCI-P3 sedang, Rec2020 paling besar.',pts:[
  `<b>Rec.709 (BT.709):</b> standar <b>HD TV</b> dan video web. Sama dasarnya dengan sRGB. Warna paling terbatas. Aman untuk hampir semua layar.`,
  `<b>DCI-P3:</b> standar <b>bioskop digital</b>. Lebih luas dari 709, terutama di merah dan hijau yang lebih "kaya". Banyak HP dan laptop modern pakai versi Display P3.`,
  `<b>Rec.2020 (BT.2020):</b> standar <b>UHD / 4K HDR</b>. Gamut terluas, jadi target masa depan. Belum ada layar yang menampilkan 100%.`,
  `<b>Angka kira-kira</b> (porsi dari seluruh warna yang terlihat mata, CIE 1931): 709 sekitar 36%, DCI-P3 sekitar 45%, Rec.2020 sekitar 76%. Ini gambaran, bukan angka pasti.`,
  `<b>Persamaan:</b> ketiganya mendefinisikan warna dasar (merah, hijau, biru) dan titik putih lewat segitiga di diagram warna. Titik putih 709 dan 2020 = D65. DCI-P3 bioskop punya titik putih sendiri, sedangkan Display P3 memakai D65.`,
  `<b>Kenapa penting di sinematografi:</b> kamu syuting dalam gamut lebar, lalu grading ke gamut tujuan (web = 709, bioskop = P3, HDR = 2020).
   ${e('film untuk YouTube di-export Rec.709. Film untuk bioskop di-grade P3.')}`
 ],ingat:'709 = TV / web (terkecil). P3 = bioskop (sedang). 2020 = UHD HDR (terbesar).',
  vis:()=>[SV.gamut(),V.table('Perbandingan',['','Rec.709','DCI-P3','Rec.2020'],[['Untuk','HD TV, web','Bioskop digital','UHD, HDR'],['Ukuran gamut','Kecil','Sedang','Besar'],['Perkiraan area','~36%','~45%','~76%'],['Titik putih','D65','Khas bioskop (Display P3: D65)','D65']])]},
 {id:'sin5',t:'S-Log2 dan S-Log3',gist:'Keduanya kurva rekam "log" dari Sony. Hasilnya gambar pucat tapi memuat detail terang dan gelap lebih banyak, untuk di-grade nanti.',pts:[
  `<b>Apa itu log?</b> Cara merekam yang "memampatkan" rentang terang-gelap yang lebar agar muat di file. Gambar mentah terlihat pucat dan datar. Setelah di-grading (atau dipasang LUT), kembali normal.`,
  `<b>S-Log2:</b> generasi lebih lama dari Sony. Sering dipasangkan dengan S-Gamut. Gambar lebih terang pada tonal tengah (abu-abu 18% di sekitar 32%), bayangan lebih cepat naik, noise di gelap lebih terlihat.`,
  `<b>S-Log3:</b> lebih baru. Mirip kurva Cineon yang dipakai di dunia film. Abu-abu 18% di sekitar 41%, memberi lebih banyak ruang detail di <b>bayangan dan nada tengah</b>, grading terasa lebih natural.`,
  `<b>Persamaan:</b> keduanya merekam dynamic range lebar (sekitar 14 stop pada banyak kamera Sony), butuh grading atau LUT, dan lebih baik direkam 10-bit.`,
  `<b>Mana yang dipakai?</b> Kebanyakan kamera Sony baru menyarankan S-Log3. S-Log2 ada karena kamera lama.`,
  `<b>Catatan:</b> nilai persen di atas berasal dari data kurva Sony. Boleh sedikit berbeda antar kamera, jadi anggap sebagai gambaran.`
 ],ingat:'S-Log2 = lama. S-Log3 = baru, mirip Cineon, lebih halus di bayangan. Keduanya log, pucat, perlu grading.',
  vis:()=>[SV.slog(),V.table('Perbandingan',['','S-Log2','S-Log3'],[['Generasi','Lebih lama','Lebih baru'],['Abu-abu 18%','~32%','~41%'],['Karakter','Cenderung lebih kontras, bayangan cepat naik','Lebih natural di bayangan'],['Dynamic range','~14 stop (tergantung kamera)','~14 stop atau lebih (tergantung kamera)'],['Persamaan','Log, pucat, butuh grading','Log, pucat, butuh grading']])]},
 {id:'sin6',t:'Lift, Gamma, Gain',gist:'Tiga kontrol grading warna: Lift mengubah bagian gelap, Gamma bagian tengah, Gain bagian terang.',pts:[
  `<b>Lift:</b> mengatur <b>bayangan</b> (area gelap). Naikkan = hitam jadi keabu-abuan (look pudar). Turunkan = hitam lebih pekat.`,
  `<b>Gamma:</b> mengatur <b>nada tengah</b> (kulit, sebagian besar isi gambar). Naikkan = gambar terasa lebih terang tanpa menggeser hitam dan putih.`,
  `<b>Gain:</b> mengatur <b>highlight</b> (area terang). Naikkan = putih lebih terang, tapi hati-hati clip (detail hilang).`,
  `<b>Warna:</b> ketiganya biasanya berupa roda warna. Tambah biru di Lift untuk bayangan dingin, tambah oranye di Gain untuk highlight hangat (look "teal and orange").`,
  `<b>Mirip tapi beda:</b> Shadows, Midtones, Highlights itu istilah serupa. Bedanya, Lift/Gamma/Gain bekerja mulus ke seluruh kurva, sementara Shadows/Mids/Highlights lebih terbatas per daerah.`
 ],ingat:'Lift = gelap, Gamma = tengah, Gain = terang. Lift naik = hitam pudar. Gain naik = putih makin terang (awas clip).',
  vis:()=>[SV.lgg()]},
 {id:'sin7',t:'Perbedaan dan persamaan (ringkasan)',gist:'Semua istilah dikelompokkan supaya kamu bisa menjawab "bedanya apa" dan "samanya apa".',pts:[
  `<b>Kelompok cahaya:</b> Chiaroscuro, Rembrandt, Cove, Contrast ratio. Persamaan: semuanya soal mengatur terang-gelap. Beda: chiaroscuro = gaya, Rembrandt = penataan satu lampu, cove = jenis sumber lembut, contrast ratio = ukuran angka.`,
  `<b>Kelompok warna:</b> Rec709, DCI-P3, Rec2020. Persamaan: standar warna berbentuk segitiga di diagram. Beda: ukuran gamut dan tujuan (web, bioskop, UHD).`,
  `<b>Kelompok kurva rekam:</b> S-Log2, S-Log3. Persamaan: kurva log Sony, pucat, perlu grading. Beda: generasi dan penempatan abu-abu 18%.`,
  `<b>Kelompok grading:</b> Lift, Gamma, Gain. Persamaan: kontrol tonal dalam color grading. Beda: lift = bayangan, gamma = tengah, gain = highlight.`
 ],ingat:'Cahaya (4), Warna (3), Kurva (2), Grading (3). Hafal ide tiap kelompok.',
  vis:()=>[V.table('Peta istilah',['Kelompok','Istilah','Yang sama','Yang beda'],[['Cahaya','Chiaroscuro, Rembrandt, Cove, Contrast ratio','Mengatur terang-gelap','Gaya vs teknik vs sumber vs ukuran'],['Warna','Rec709, DCI-P3, Rec2020','Standar warna','Kecil / sedang / besar'],['Kurva','S-Log2, S-Log3','Log Sony','Lama vs baru'],['Grading','Lift, Gamma, Gain','Kontrol tonal','Gelap / tengah / terang']])]}
],
ak:[
 {id:'ak1',t:'1. Keselamatan (Soteriologi)',gist:'Pembebasan manusia dari dosa, maut, dan hukuman Allah, serta pemulihan relasi dengan Allah melalui karya Yesus Kristus. Kata Yunaninya soteria. Keselamatan sering dipahami dalam tiga waktu: sudah (dibenarkan), sedang (dikuduskan), dan akan (dimuliakan).',pts:[
  `<b>Pandangan terkenal</b>`,
  `<b>Katolik:</b> Keselamatan adalah anugerah Allah yang diterima lewat iman, sakramen (terutama baptisan), dan perbuatan kasih. Pembenaran dipahami sebagai proses (Konsili Trente).`,
  `<b>Martin Luther (Lutheran):</b> Sola gratia dan sola fide, yaitu selamat hanya oleh anugerah melalui iman. Pembenaran bersifat forensik: Allah menyatakan orang berdosa benar karena Kristus.`,
  `<b>Yohanes Calvin (Reformed):</b> Penekanan pada kedaulatan Allah dan predestinasi (pemilihan). Ajaran ini dirangkum dalam TULIP.`,
  `<b>Jacobus Arminius dan John Wesley (Arminian/Wesleyan):</b> Allah memberi anugerah kepada semua orang, dan manusia bebas menerima atau menolaknya. Wesley menekankan kekudusan hidup.`,
  `<b>Ortodoks Timur:</b> Keselamatan adalah theosis, yaitu manusia dibawa makin dekat dan serupa dengan Allah.`,
  `<b>Teori penebusan</b>`,
  `<b>Satisfaction (Anselmus):</b> Kristus memuaskan keadilan Allah.`,
  `<b>Penal substitution (Calvin):</b> Kristus menggantikan manusia menanggung hukuman.`,
  `<b>Christus Victor (Gustaf Aulén):</b> Kristus mengalahkan dosa, maut, dan Iblis.`,
  `<b>Moral influence (Abelard):</b> Salib menunjukkan kasih Allah dan menggerakkan manusia untuk bertobat.`,
  `<b>Pandangan tentang cakupan keselamatan</b>`,
  `<b>Eksklusivisme:</b> keselamatan hanya melalui Kristus.`,
  `<b>Inklusivisme</b> (Karl Rahner).`,
  `<b>Pluralisme</b> (John Hick).`,
  `<b>Universalisme:</b> semua orang akhirnya diselamatkan.`
 ]},
 {id:'ak2',t:'2. Manusia Baru',gist:'Perubahan hidup orang percaya yang meninggalkan "manusia lama" (hidup dalam dosa) dan hidup dalam kebenaran dan kekudusan di dalam Kristus. Dasar Alkitabnya antara lain 2 Korintus 5:17, Efesus 4:22-24, Kolose 3:9-10, dan Roma 6:6.',pts:[
  `<b>Pandangan terkenal</b>`,
  `<b>Paulus:</b> Manusia lama disalibkan bersama Kristus. Kristus adalah "Adam kedua" yang menjadi awal umat manusia yang baru.`,
  `<b>Luther:</b> Simul justus et peccator, yaitu orang percaya sekaligus benar dan berdosa. Manusia lama dan baru terus bergumul sepanjang hidup.`,
  `<b>Calvin:</b> Pembaruan terdiri dari mortification (mematikan dosa) dan vivification (dihidupkan dalam kebenaran), yang berlangsung seumur hidup.`,
  `<b>Reformed/Injili:</b> Manusia baru dimulai dengan regenerasi (kelahiran baru oleh Roh Kudus), lalu bertumbuh lewat pengudusan progresif.`,
  `<b>Katolik:</b> Baptisan menghapus dosa asal dan memberi rahmat pengudusan yang menjadikan seseorang ciptaan baru.`,
  `<b>Wesley:</b> Kelahiran baru diikuti kekudusan yang makin sempurna (entire sanctification).`,
  `<b>Pentakosta/Karismatik:</b> Pembaruan dialami melalui baptisan Roh Kudus dan hidup dalam kuasa Roh.`
 ]},
 {id:'ak3',t:'3. Yohanes 10:10',gist:'Teks resmi Alkitab Indonesia (Terjemahan Baru) dilindungi hak cipta. Ringkasan di bawah ditulis dengan kata-kata sendiri. Untuk kutipan persis, ambil dari Alkitab atau alkitab.sabda.org.',pts:[
  `<b>A. Teks (Yohanes 10:1-10)</b>`,
  `<b>Ay. 1-2:</b> Yesus berkata bahwa orang yang masuk ke kandang domba tidak lewat pintu, tetapi memanjat dari tempat lain, adalah pencuri dan perampok. Gembala yang sesungguhnya masuk melalui pintu.`,
  `<b>Ay. 3-5:</b> Penjaga membukakan pintu bagi gembala itu. Domba-domba mendengar suaranya, dipanggil menurut namanya, lalu dituntun keluar. Mereka mengikutinya karena mengenal suaranya, tetapi tidak akan mengikuti orang asing.`,
  `<b>Ay. 6:</b> Penulis mencatat bahwa para pendengar tidak mengerti maksud perumpamaan ini.`,
  `<b>Ay. 7-9:</b> Yesus menjelaskan bahwa Dia sendiri adalah pintu bagi domba-domba. Semua yang datang sebelum Dia adalah pencuri dan perampok, dan domba tidak mendengarkan mereka. Siapa yang masuk melalui Dia akan diselamatkan, bebas keluar masuk, dan mendapat padang rumput.`,
  `<b>Ay. 10:</b> Pencuri datang hanya untuk mencuri, membunuh, dan membinasakan. Yesus datang supaya domba-domba memiliki hidup, dan memilikinya dalam kelimpahan.`,
  `<b>B. Konteks</b>`,
  `<b>Konteks dekat (pasal 9):</b> Yohanes 10 melanjutkan pasal 9, yaitu Yesus menyembuhkan orang yang buta sejak lahir. Orang Farisi menyelidiki orang itu, lalu mengusirnya dari rumah ibadat. Karena itu "pencuri dan perampok" dalam 10:1-10 terutama menunjuk pada pemimpin agama yang menindas umat, bukan memeliharanya. Orang buta yang diusir itu adalah contoh "domba" yang diabaikan oleh gembala palsu, lalu dicari dan diterima oleh Yesus (9:35-38).`,
  `<b>Latar Perjanjian Lama:</b> Gambaran gembala dan domba sangat dikenal bangsa Israel. Allah disebut Gembala Israel (Mzm. 23), dan para pemimpin yang tidak peduli umat dikecam sebagai gembala-gembala jahat (Yeh. 34, Yer. 23). Dengan menyebut diri gembala yang baik, Yesus menyatakan bahwa Dia menggenapi peran yang dijanjikan Allah.`,
  `<b>Latar budaya:</b> Kandang domba di Palestina biasanya berupa pagar batu dengan satu pintu. Pada malam hari gembala sering berbaring di pintu itu, sehingga ia sendiri menjadi "pintu" yang melindungi domba.`,
  `<b>Konteks sastra:</b> Bagian ini adalah salah satu pernyataan "Aku adalah" dalam Injil Yohanes (Akulah pintu, Akulah gembala yang baik). Ayat 10 menjadi inti dari bagian ini, yaitu pertentangan antara tujuan pencuri dan tujuan Kristus. Pembahasan tentang gembala yang baik berlanjut sampai ayat 18, dengan puncak bahwa gembala itu menyerahkan nyawanya bagi domba.`,
  `<b>C. Tafsiran. Makna kata kunci</b>`,
  `<b>Hidup (Yun. zoe):</b> hidup ilahi dan hidup kekal, bukan sekadar hidup biologis (bios).`,
  `<b>Berkelimpahan (Yun. perissos):</b> melimpah, melampaui kebutuhan dasar.`,
  `<b>Mencuri, membunuh, membinasakan:</b> tiga kata kerja yang menggambarkan pemimpin palsu yang mengeksploitasi umat demi keuntungan sendiri.`,
  `<b>Tafsiran utama</b>`,
  `<b>Tradisional/Injili/Reformed:</b> Hidup berkelimpahan adalah hidup kekal dan hidup rohani yang penuh dalam hubungan dengan Allah, yaitu damai sejahtera, sukacita, dan pengampunan, bukan kekayaan materi. Pandangan ini paling sesuai dengan konteks dan tema Injil Yohanes.`,
  `<b>Teologi kemakmuran:</b> Mengartikannya sebagai janji kesehatan dan kekayaan jasmani. Tafsiran ini banyak dikritik karena mengabaikan konteks dan kontras antara gembala sejati dan gembala palsu.`,
  `<b>Teologi pembebasan:</b> Menekankan bahwa Kristus menghendaki kehidupan yang layak bagi kaum miskin dan tertindas, sehingga gereja dituntut berpihak pada keadilan sosial.`,
  `<b>Agustinus dan Calvin:</b> Menekankan Kristus sebagai sumber hidup sejati. Hidup itu diterima melalui "pintu" (Kristus), dan gembala itu rela memberikan nyawa-Nya bagi domba.`
 ],ingat:'Intinya: Ayat ini mengontraskan dua jenis pemimpin. Pemimpin palsu mengambil hidup dari domba demi dirinya sendiri, sedangkan Kristus memberikan hidup-Nya supaya domba-domba hidup. Hidup berkelimpahan adalah buah dari karya-Nya itu.'},
 {id:'ak4',t:'4. Kutuk',gist:'Pernyataan atau keadaan yang menjadi akibat buruk dan hukuman ilahi karena pelanggaran terhadap Allah atau perjanjian-Nya. Dalam bahasa Ibrani qelalah atau arar, dalam bahasa Yunani katara atau anathema. Contohnya: Kejadian 3:14-19 (kutuk atas ular dan tanah), Ulangan 27-28 (berkat dan kutuk perjanjian), dan Galatia 3:13 (Kristus menebus kita dari kutuk Taurat dengan menjadi kutuk).',pts:[
  `<b>Pandangan terkenal</b>`,
  `<b>Reformed/Injili:</b> Kutuk adalah akibat dosa dan pelanggaran hukum Taurat. Kristus menanggungnya di salib, sehingga orang percaya bebas dari kutuk itu.`,
  `<b>Katolik:</b> Kata anathema juga dipakai dalam konteks gerejawi, yaitu pengucilan atau penolakan terhadap ajaran sesat.`,
  `<b>Pentakosta/Karismatik tertentu:</b> Mengajarkan adanya "kutuk generasi" (dosa leluhur yang menurun) dan perlunya doa pelepasan. Pandangan ini diperdebatkan karena dianggap bertentangan dengan Yehezkiel 18 (setiap orang menanggung dosanya sendiri) dan karya Kristus yang sudah cukup.`,
  `<b>Pandangan arus utama:</b> Penderitaan tidak otomatis berarti kutukan (lihat Yoh. 9:1-3 tentang orang yang buta sejak lahir), dan kutuk tanpa sebab tidak berlaku (Ams. 26:2).`
 ]},
 {id:'ak5',t:'5. Iman',gist:'Kepercayaan dan penyerahan diri kepada Allah serta janji-Nya. Ibrani 11:1 menyebut iman sebagai dasar dari segala sesuatu yang kita harapkan dan bukti dari segala sesuatu yang tidak kita lihat. Kata Yunaninya pistis, Ibraninya emunah. Pada masa Reformasi, iman dipahami memiliki tiga unsur: notitia (pengetahuan), assensus (persetujuan), dan fiducia (kepercayaan/penyerahan diri).',pts:[
  `<b>Pandangan terkenal</b>`,
  `<b>Agustinus dan Anselmus:</b> Credo ut intelligam ("aku percaya supaya aku mengerti"), yaitu iman mendahului pemahaman.`,
  `<b>Thomas Aquinas (Katolik):</b> Iman adalah kebajikan teologal (bersama pengharapan dan kasih) yang diberikan Allah. Iman dan akal budi tidak bertentangan.`,
  `<b>Luther:</b> Iman adalah kepercayaan hidup kepada janji Allah dalam Kristus, dan satu-satunya jalan pembenaran (sola fide).`,
  `<b>Calvin:</b> Iman adalah pengetahuan yang teguh tentang kebaikan Allah, yang dikaruniakan oleh Roh Kudus.`,
  `<b>Arminian:</b> Iman adalah respons bebas manusia terhadap anugerah Allah.`,
  `<b>Yakobus vs Paulus:</b> Paulus menekankan pembenaran oleh iman, Yakobus menekankan bahwa iman tanpa perbuatan adalah mati. Banyak teolog menyatukannya: iman yang sejati pasti menghasilkan perbuatan, tetapi perbuatan bukan dasar keselamatan.`,
  `<b>Søren Kierkegaard:</b> Iman sebagai "lompatan" kepercayaan yang melampaui bukti rasional.`,
  `<b>Karl Barth:</b> Iman adalah karunia dan respons terhadap penyataan Allah, bukan hasil usaha manusia.`
 ],ingat:'Tips UTS: Tiap dosen biasanya mengikuti tradisi gereja tertentu (misalnya Reformed, Katolik, atau Pentakosta), jadi cocokkan jawaban dengan slide atau modul kuliah.'}
],
pt:[
 {id:'pt1',t:'1. Fundasi IMC dan pergeseran paradigma',gist:'IMC (Komunikasi Pemasaran Terpadu) bukan sekadar beriklan di banyak media. Ia filosofi manajerial strategis: menyatukan semua elemen komunikasi promosi agar berbicara dengan "Satu Suara" (Single Voice), untuk membangun ekuitas merek jangka panjang dan memicu perubahan perilaku nyata.',pts:[
  `<b>Pendekatan tradisional: Inside-Out (Silo).</b> Departemen bekerja terpisah, agensi berjalan sendiri-sendiri, menghasilkan pesan yang tumpang tindih dan membingungkan konsumen.`,
  `<b>Pendekatan IMC modern: Outside-In (Holistik).</b> Dimulai dari kebutuhan pelanggan, mengelola seluruh titik kontak (touchpoints 360°) untuk menciptakan sinergisitas pesan yang kuat.`
 ],ingat:'IMC = Satu Suara. Tradisional: inside-out (silo). Modern: outside-in (holistik, touchpoints 360°).',
  vis:()=>[V.table('Tradisional vs IMC modern',['','Tradisional','IMC modern'],[['Arah','Inside-Out (Silo)','Outside-In (Holistik)'],['Cara kerja','Departemen dan agensi sendiri-sendiri','Mulai dari kebutuhan pelanggan, kelola semua touchpoints 360°'],['Hasil','Pesan tumpang tindih, membingungkan','Pesan sinergis, Satu Suara']])]},
 {id:'pt2',t:'2. Kekuatan sinergi dan bukti empiris',gist:'Bauran komunikasi yang terkoordinasi menghasilkan efek pengganda (multiplier effect).',pts:[
  `<b>Studi Levi\'s Dockers:</b> iklan TV dan media cetak yang dijalankan bersamaan menciptakan lonjakan penjualan eksponensial, jauh melampaui jumlah efek individu masing-masing media.`
 ],ingat:'Sinergi = multiplier effect. Contoh: Levi\'s Dockers (TV + cetak bersamaan).'},
 {id:'pt3',t:'3. Ekuitas merek berbasis konsumen (Keller)',gist:'Ekuitas merek adalah nilai tambah yang diberikan pada produk. Menurut Customer-Based Brand Equity, ekuitas dibangun di atas dua pilar di benak konsumen: Brand Awareness (Kesadaran) dan Brand Image (Citra Merek).',pts:[
  `<b>Pilar 1: Kesadaran merek (Awareness Ladder):</b>
   <br><b>Top of Mind:</b> merek pertama yang melintas di kepala.
   <br><b>Brand Recall:</b> diingat tanpa bantuan petunjuk.
   <br><b>Brand Recognition:</b> dikenali saat melihat logo atau kemasan.
   <br><b>Unaware:</b> konsumen tidak tahu sama sekali.`,
  `<b>Pilar 2: Citra merek (Asosiasi Memori):</b> terbentuk dari atribut produk (fisik/non-fisik) serta manfaat yang dirasakan konsumen: <b>Fungsional</b> (menyelesaikan masalah), <b>Simbolis</b> (status/identitas), dan <b>Eksperiensial</b> (sensasi/emosi).
   ${e('"Aqua" disebut pertama saat ditanya air mineral = Top of Mind.')}`
 ],ingat:'Tangga: Top of Mind > Recall > Recognition > Unaware. Citra: Fungsional, Simbolis, Eksperiensial.',
  vis:()=>[V.pyr('Awareness ladder (atas = terkuat)',[['Top of Mind','Merek pertama yang teringat',46],['Brand Recall','Diingat tanpa petunjuk',64],['Brand Recognition','Dikenali saat melihat logo / kemasan',82],['Unaware','Tidak tahu sama sekali',100]]),V.cols('3 manfaat citra merek',[['Fungsional','Menyelesaikan masalah'],['Simbolis','Status atau identitas'],['Eksperiensial','Sensasi atau emosi']])]},
 {id:'pt4',t:'4. Akuntabilitas Marcom dan Marketing Mix Modeling (MMM)',gist:'Manajemen tingkat atas (C-Suite) menuntut bukti finansial nyata atas setiap anggaran promosi. Pengukuran ROI dan kontribusi penjualan menghadapi tantangan isolasi data dan efek jangka panjang.',pts:[
  `<b>Solusi ekonometrika: Marketing Mix Modeling (MMM).</b> Model statistik tingkat lanjut yang memasukkan variabel harga, data iklan, promosi pesaing, musim, dan kondisi ekonomi untuk memisahkan sinyal periklanan dari kebisingan eksternal guna memprediksi ROI tiap saluran media.`
 ],ingat:'MMM = model statistik untuk memisahkan efek iklan dari faktor lain dan memprediksi ROI tiap saluran.'},
 {id:'pt5',t:'5. STP dan revolusi impresi mikro (Real-Time Bidding)',gist:'Mass marketing (satu ukuran untuk semua) sudah usang. Pemasar modern beralih ke Narrowcasting melalui analisis data mendalam.',pts:[
  `<b>4 pilar segmentasi:</b> Demografi, Psikografis (VALS), Geodemografi, dan Manfaat.`,
  `<b>Real-Time Bidding (RTB) vs segmentasi tradisional:</b> fokus target, metode beli, dan pengukuran berbeda (lihat tabel).`
 ],ingat:'4 segmentasi: Demografi, Psikografis (VALS), Geodemografi, Manfaat. RTB = lelang milidetik per impresi.',
  vis:()=>[V.table('Tradisional vs RTB digital',['Dimensi','Strategi tradisional','Real-Time Bidding'],[['Fokus target','Kelompok makro / ribuan orang','Impresi mikro (individu spesifik)'],['Metode beli','Pembelian ruang iklan massal (bulk)','Lelang instan milidetik per impresi'],['Pengukuran','Tertunda, survei pasca-kampanye','Real-time tracking (klik dan konversi)']])]},
 {id:'pt6',t:'6. Lima katalisator adopsi produk baru',gist:'Saat meluncurkan inovasi, kecepatan adopsi pasar ditentukan oleh lima faktor.',pts:[
  `<b>Keunggulan relatif</b> dibanding pesaing.`,
  `<b>Kompatibilitas</b> dengan gaya hidup.`,
  `<b>Kompleksitas</b> yang rendah.`,
  `<b>Trialabilitas:</b> mudah dicoba dengan risiko minimal.`,
  `<b>Observabilitas:</b> hasil terlihat nyata.`
 ],ingat:'5 faktor: Keunggulan relatif, Kompatibilitas, Kompleksitas rendah, Trialabilitas, Observabilitas.'},
 {id:'pt7',t:'7. Psikologi persuasi: CPM, HEM, dan ELM',gist:'Keputusan konsumen dipengaruhi dua mesin pemrosesan: Otak Dingin (Rasional/CPM) dan Otak Panas (Emosional/HEM). Melalui Elaboration Likelihood Model (ELM), rute kognitif ditentukan oleh gerbang MOA (Motivation, Opportunity, Ability).',pts:[
  `<b>Rute Sentral (CPM), MOA tinggi:</b> konsumen aktif menganalisis argumen dan spesifikasi produk. Alur: Kognitif → Afektif → Konatif. Menghasilkan perubahan sikap yang tahan lama.`,
  `<b>Rute Periferal (HEM), MOA rendah:</b> konsumen malas berpikir kritis; terdistraksi oleh musik asik, visual estetik, atau selebritas. Alur: Minimal Kognitif → Konatif → Afektif.`
 ],ingat:'MOA = Motivation, Opportunity, Ability. Tinggi = Sentral (CPM). Rendah = Periferal (HEM).',
  vis:()=>[V.table('Dua rute ELM',['','Rute Sentral (CPM)','Rute Periferal (HEM)'],[['MOA','Tinggi','Rendah'],['Perilaku','Menganalisis argumen dan spesifikasi','Malas berpikir kritis, terdistraksi musik, visual, selebritas'],['Alur','Kognitif → Afektif → Konatif','Minimal Kognitif → Konatif → Afektif'],['Hasil','Sikap tahan lama','Sikap lebih mudah berubah']])]},
 {id:'pt8',t:'8. Enam alat pengaruh sosial Cialdini (Click-Whirr)',gist:'Pemasar memakai pemicu pintas mental otomatis untuk mempercepat tindakan pembelian.',pts:[
  `<b>Timbal balik (Reciprocation):</b> memberi sampel atau trial gratis agar konsumen merasa wajib membalas budi.`,
  `<b>Komitmen dan konsistensi:</b> dorongan mempertahankan pilihan kecil sebelumnya (misal: mengumpulkan stempel poin).`,
  `<b>Bukti sosial (Social Proof):</b> mengikuti kerumunan atau viralitas (FOMO) karena menganggap tindakan mayoritas itu benar.`,
  `<b>Rasa suka (Liking):</b> memakai endorser yang disukai.`,
  `<b>Otoritas:</b> figur ahli atau dokter (misal: rekomendasi 9 dari 10 ahli).`,
  `<b>Kelangkaan (Scarcity):</b> "Sisa 2 kamar!" memicu reaktansi psikologis agar cepat membeli.`
 ],ingat:'6 alat: Timbal balik, Komitmen-konsistensi, Bukti sosial, Liking, Otoritas, Kelangkaan.',
  vis:()=>[V.table('6 alat Cialdini',['Alat','Contoh'],[['Timbal balik','Sampel gratis'],['Komitmen dan konsistensi','Kartu stempel poin'],['Bukti sosial','Viral, FOMO'],['Rasa suka','Endorser yang disukai'],['Otoritas','9 dari 10 dokter merekomendasikan'],['Kelangkaan','"Sisa 2 kamar!"']])]},
 {id:'pt9',t:'9. Rantai Means-End dan kerangka MECCAS',gist:'Konsumen tidak membeli fitur fisik semata, melainkan pemenuhan nilai diri.',pts:[

const nextExam=()=>{const n=new Date();return EXAMS.find(e=>e.end>n)||null};
function tickClock(){
  const now=new Date();
  $('#clock').textContent=hhmmss(now)+' WIB';
  const c=$('#cd-d');if(!c||$('#p-home').hidden)return;
  const n=nextExam();if(!n)return;
  const running=n.start<=now;
  const [d,h,m,s]=parts((running?n.end:n.start)-now);
  $('#cd-d').textContent=d;$('#cd-h').textContent=p2(h);$('#cd-m').textContent=p2(m);$('#cd-s').textContent=p2(s);
  if(running!==(c.dataset.run==='1'))renderHome();
}
setInterval(tickClock,1000);

let quizSel=KEYS,quizN=10;
const quiz={run:null};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const allQ=()=>QB.map(([s,q,c,a,b,d,e])=>({s,q,o:[c,a,b,d],a:0,e})).concat(aiq);
function renderQuizSetup(){
