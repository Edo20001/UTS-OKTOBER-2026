<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>UTS Mode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: header + jam WIB, tab bawah di HP (tab atas di desktop), satu kolom lalu grid. */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --surface2:#EAECF1; --line:#DFE2E8;
  --fg:#12141A; --muted:#5A6373; --accent:#D9430F; --accent-ink:#FFFFFF;
  --c-pkn:#6446E0; --c-pk:#0A7F80; --c-idn:#A4670C; --c-ai:#C2185B;
  --good:#15803D; --bad:#C62828;
  --f-display:'Poppins',system-ui,sans-serif; --f-body:'Poppins',system-ui,sans-serif; --f-mono:'Poppins',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0D12; --surface:#141821; --surface2:#1C212C; --line:#262C39;
  --fg:#EEF0F5; --muted:#9BA4B6; --accent:#FF6A32; --accent-ink:#1A0A02;
  --c-pkn:#A593FF; --c-pk:#3FD0C9; --c-idn:#F2B84B; --c-ai:#FF7EB6;
  --good:#4ADE80; --bad:#FF7B7B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0D12; --surface:#141821; --surface2:#1C212C; --line:#262C39;
  --fg:#EEF0F5; --muted:#9BA4B6; --accent:#FF6A32; --accent-ink:#1A0A02;
  --c-pkn:#A593FF; --c-pk:#3FD0C9; --c-idn:#F2B84B; --c-ai:#FF7EB6;
  --good:#4ADE80; --bad:#FF7B7B; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font:16px/1.6 var(--f-body);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin-inline:auto;padding-inline:16px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{font:800 20px var(--f-display);display:flex;align-items:center;gap:8px;margin-right:auto}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.clock{font:500 13px var(--f-mono);font-variant-numeric:tabular-nums;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;white-space:nowrap}
.tbtn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;width:36px;height:36px}
.tbtn svg{width:17px;height:17px}
.top{display:flex;gap:4px;padding-bottom:10px}
.top button{border:0;background:transparent;color:var(--muted);padding:8px 16px;border-radius:999px;font-weight:600;font-size:14px}
.top button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.bottom{display:none}
@media(max-width:720px){
  .top{display:none}
  .clock{font-size:12px;padding:5px 10px}
  .bottom{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .bottom button{border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;padding:4px 0;min-width:0}
  .bottom svg{width:22px;height:22px}
  .bottom button[aria-selected="true"]{color:var(--accent)}
  main{padding-bottom:88px!important}
}

main{padding-block:24px 56px}
.panel{display:flex;flex-direction:column;gap:20px}
.eyebrow{font:500 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h2{font-size:clamp(28px,6vw,40px)}
h3{font-size:19px}
.lead{color:var(--muted);max-width:60ch}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:600;font-size:14px;min-height:42px}
.btn:hover{border-color:var(--fg)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:6px 12px;font-size:13px;min-height:36px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.tag{display:inline-flex;align-items:center;font:500 12px var(--f-mono);color:var(--c);border-radius:999px;padding:3px 10px;background:color-mix(in srgb,var(--c) 14%,transparent)}
.s-pkn{--c:var(--c-pkn)}.s-pk{--c:var(--c-pk)}.s-idn{--c:var(--c-idn)}.s-ai{--c:var(--c-ai)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}

/* hero */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:16px}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cd div{background:var(--surface2);border-radius:16px;padding:14px 4px 10px;text-align:center;min-width:0}
.cd b{display:block;font:800 clamp(30px,9vw,52px)/1 var(--f-display);font-variant-numeric:tabular-nums}
.cd span{font:500 11px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.nx{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.nx h3{font-size:20px}
.bar-p{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar-p>span{display:block;height:100%;background:var(--c,var(--accent));border-radius:99px;transition:width .3s}
.subjcard{background:color-mix(in srgb,var(--c) 7%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 22%,var(--line));border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}

/* jadwal */
.day{display:flex;flex-direction:column;gap:8px}
.day h3{font:500 13px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.exam{display:grid;grid-template-columns:92px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.exam.now,.exam.nxt{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.exam.done{opacity:.5}
.exam .t{font:500 14px/1.3 var(--f-mono);font-variant-numeric:tabular-nums}
.exam .t small{display:block;color:var(--muted);font-size:12px}
.exam .n{font-weight:700;min-width:0}
.exam .k{font-size:13px;color:var(--muted)}
.pill{font:500 11px var(--f-mono);background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:2px 9px;margin-left:6px;vertical-align:middle}
@media(max-width:520px){.exam{grid-template-columns:1fr auto;gap:6px 12px}.exam .t{grid-column:1/-1;display:flex;gap:8px;align-items:baseline}.exam .t small{display:inline}}

/* materi */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;min-height:40px}
.chip[aria-pressed="true"]{background:var(--c,var(--fg));border-color:var(--c,var(--fg));color:var(--bg)}
details.topic{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
details.topic summary{list-style:none;cursor:pointer;padding:18px 20px;display:flex;gap:12px;align-items:center;justify-content:space-between;font-weight:700;font-size:17px}
details.topic summary::-webkit-details-marker{display:none}
details.topic summary::after{content:"+";font:500 22px var(--f-mono);color:var(--muted);flex:none}
details.topic[open] summary::after{content:"–"}
details.topic .body{padding:0 20px 20px;display:flex;flex-direction:column;gap:16px}
.gist{background:color-mix(in srgb,var(--c) 12%,var(--surface));border-radius:14px;padding:12px 14px;font-weight:600}
details.topic li{line-height:1.7}
.ex{display:block;margin-top:4px;padding:6px 10px;border-radius:10px;background:var(--surface2);color:var(--muted);font-size:14px}
details.topic ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:14px}
details.topic li::marker{color:var(--c)}
.done-ok{display:inline-flex;gap:10px;align-items:center;font-weight:600;font-size:14px;min-height:36px}
.done-ok input{width:20px;height:20px;accent-color:var(--accent)}
.note{border:1px dashed var(--line);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--muted)}

/* visual */
.vis{margin:0;background:var(--surface2);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.vis figcaption{font:500 11px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.step{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border-radius:10px;padding:7px 12px;font-weight:600;font-size:14px}
.step i{font:500 11px var(--f-mono);color:var(--accent);font-style:normal}
.arr{color:var(--muted);font-weight:400}
.pyr{display:flex;flex-direction:column;align-items:center;gap:4px}
.pyr div{background:var(--surface);border-radius:10px;padding:7px 10px;text-align:center;font-size:13px;line-height:1.3;width:max(var(--w),150px);max-width:100%}
.pyr b{display:block;font-size:14px}
.pyr div:first-child{box-shadow:0 0 0 1.5px var(--accent) inset}
.g2{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px}
.g2 .cell{background:var(--surface);border-radius:12px;padding:10px;font-size:13px;line-height:1.4;min-width:0}
.g2 .cell b{display:block;font-size:14px;margin-bottom:2px}
.g2 .ax{font:500 10px var(--f-mono);color:var(--muted);display:flex;align-items:center;justify-content:center;text-align:center;text-transform:uppercase;letter-spacing:.05em}
.g2 .ay{writing-mode:vertical-rl;transform:rotate(180deg)}
.cols3{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr))}
.cols3>div{background:var(--surface);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.45}
.cols3 b{display:block;font-size:14px;margin-bottom:2px;color:var(--c,var(--accent))}
.twrap{overflow-x:auto}
table.tb{border-collapse:collapse;width:100%;font-size:13.5px;min-width:380px}
table.tb th,table.tb td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.tb th{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}

/* quiz */
.qbox{display:flex;flex-direction:column;gap:16px;max-width:720px}
.qtext{font:700 clamp(19px,4vw,23px)/1.35 var(--f-body)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;display:flex;gap:12px;min-height:52px}
.opt:hover:not([disabled]){border-color:var(--fg)}
.opt .l{font:500 13px var(--f-mono);color:var(--muted);flex:none;padding-top:2px}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.opt[disabled]{cursor:default}
.expl{background:var(--surface2);border-radius:14px;padding:12px 14px;font-size:14.5px}
.score{font:800 clamp(64px,16vw,104px)/1 var(--f-display)}
select,textarea,input[type=text]{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;width:100%}
textarea{resize:vertical;min-height:150px}

/* chat */
.chat{display:flex;flex-direction:column;gap:12px}
.log{display:flex;flex-direction:column;gap:10px;min-height:240px;max-height:56vh;overflow-y:auto;padding:2px}
.msg{max-width:88%;padding:11px 15px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.msg.u{align-self:flex-end;background:var(--fg);color:var(--bg);border-bottom-right-radius:5px}
.msg.a{align-self:flex-start;background:var(--surface2);border-bottom-left-radius:5px}
.msg.e{align-self:flex-start;color:var(--bad);border:1px solid var(--bad)}
.compose{display:flex;gap:8px;align-items:flex-end}
.compose textarea{min-height:48px;max-height:140px}
.sugs{display:flex;gap:8px;flex-wrap:wrap}
.sugs button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 13px;font-size:13px}
.sugs button:hover{border-color:var(--accent)}
.mat{display:flex;flex-direction:column;gap:8px}
.mat .head{display:flex;gap:8px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.mat pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:400 13px/1.55 var(--f-body);color:var(--muted);max-height:100px;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;font-size:14px;z-index:9;max-width:90vw}
@media(min-width:721px){.toast{bottom:24px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.bar-p>span{transition:none}}
</style>

<header>
  <div class="wrap">
    <div class="bar">
      <div class="brand"><i></i>UTS Mode</div>
      <div class="clock" id="clock" aria-label="Jam sekarang WIB">--:--:-- WIB</div>
      <button class="tbtn" id="theme" type="button" aria-label="Ganti tema"></button>
    </div>
    <nav class="top" id="nav-top" role="tablist" aria-label="Menu"></nav>
  </div>
</header>
<main class="wrap">
  <section class="panel" id="p-home"></section>
  <section class="panel" id="p-jadwal" hidden></section>
  <section class="panel" id="p-materi" hidden></section>
  <section class="panel" id="p-quiz" hidden></section>
  <section class="panel" id="p-ai" hidden></section>
  <section class="panel" id="p-saya" hidden></section>
</main>
<nav class="bottom" id="nav-bot" aria-label="Menu bawah"></nav>
<div class="toast" id="toast" hidden></div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}

/* ---------- tema ---------- */
const sv=store.get('uts.theme',null); if(sv) document.documentElement.dataset.theme=sv;
const effTheme=()=>document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function paintTheme(){const d=effTheme()==='dark';$('#theme').innerHTML=d?SUN:MOON;$('#theme').setAttribute('aria-label',d?'Ganti ke mode terang':'Ganti ke mode gelap')}
$('#theme').onclick=()=>{const n=effTheme()==='dark'?'light':'dark';document.documentElement.dataset.theme=n;store.set('uts.theme',n);paintTheme()};
paintTheme();

/* ---------- waktu (semua dihitung dalam WIB, UTC+7) ---------- */
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const wib=d=>new Date(d.getTime()+7*3600e3);
const p2=n=>String(n).padStart(2,'0');
const hhmm=d=>{const w=wib(d);return p2(w.getUTCHours())+':'+p2(w.getUTCMinutes())};
const hhmmss=d=>{const w=wib(d);return p2(w.getUTCHours())+':'+p2(w.getUTCMinutes())+':'+p2(w.getUTCSeconds())};
const dayLabel=d=>{const w=wib(d);return HARI[w.getUTCDay()]+', '+w.getUTCDate()+' '+BLN[w.getUTCMonth()]+' '+w.getUTCFullYear()};
const parts=ms=>{const s=Math.max(0,Math.floor(ms/1000));return [Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60]};

/* ---------- data ---------- */
const SUBJ={
  pkn:{name:'Pendidikan Kewarganegaraan',short:'PKn',kode:'VC547',jam:'08:00 – 09:40',ruang:'E-301'},
  pk:{name:'Perilaku Konsumen',short:'Perilaku Konsumen',kode:'VC546',jam:'10:30 – 12:10',ruang:'E-301'},
  idn:{name:'Inovasi Design Nusantara',short:'Inovasi Design',kode:'VC545',jam:'13:00 – 15:30',ruang:'N-201'},
  ai:{name:'Soal AI',short:'Soal AI'}
};
const EXAMS=[
 ['VC547','Pendidikan Kewarganegaraan','2026-10-12T08:00','2026-10-12T09:40','E-301','pkn'],
 ['VC546','Perilaku Konsumen','2026-10-12T10:30','2026-10-12T12:10','E-301','pk'],
 ['VC545','Inovasi Design Nusantara','2026-10-12T13:00','2026-10-12T15:30','N-201','idn'],
 ['VC544','Packaging Design','2026-10-13T08:00','2026-10-13T10:30','E-305'],
 ['CP501','Sinematografi','2026-10-13T13:00','2026-10-13T15:30','N-110'],
 ['VC024','Agama Kristen','2026-10-14T08:00','2026-10-14T09:40','E-301'],
 ['VC548','Pemasaran Terpadu','2026-10-15T08:00','2026-10-15T10:30','E-305'],
 ['VC549','UMKM Branding','2026-10-15T10:30','2026-10-15T13:00','E-301']
].map(([kode,nama,a,b,ruang,s])=>({kode,nama,start:new Date(a+':00+07:00'),end:new Date(b+':00+07:00'),ruang,s}));

/* ---------- visual helpers ---------- */
const V={
 flow:(t,steps)=>`<figure class="vis"><figcaption>${t}</figcaption><div class="flow">${steps.map((s,i)=>`<span class="step"><i>${i+1}</i>${s}</span>`).join('<b class="arr" aria-hidden="true">→</b>')}</div></figure>`,
 pyr:(t,lv)=>`<figure class="vis"><figcaption>${t}</figcaption><div class="pyr">${lv.map(([a,b,w])=>`<div style="--w:${w}%"><b>${a}</b>${b}</div>`).join('')}</div></figure>`,
 g2:(t,o)=>`<figure class="vis"><figcaption>${t}</figcaption><div class="g2"><span></span><span class="ax">${o.x[0]}</span><span class="ax">${o.x[1]}</span><span class="ax ay">${o.y[0]}</span>${o.c.slice(0,2).map(c=>`<div class="cell"><b>${c[0]}</b>${c[1]}</div>`).join('')}<span class="ax ay">${o.y[1]}</span>${o.c.slice(2).map(c=>`<div class="cell"><b>${c[0]}</b>${c[1]}</div>`).join('')}</div></figure>`,
 cols:(t,items)=>`<figure class="vis"><figcaption>${t}</figcaption><div class="cols3">${items.map(i=>`<div><b>${i[0]}</b>${i[1]}</div>`).join('')}</div></figure>`,
 table:(t,head,rows)=>`<figure class="vis"><figcaption>${t}</figcaption><div class="twrap"><table class="tb"><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div></figure>`
};

/* ---------- materi (bahasa sederhana) ---------- */
const e=x=>`<span class="ex">Contoh: ${x}</span>`;
const MATERI={
pkn:[
 {id:'pkn1',t:'Kenapa PKn penting?',gist:'PKn bukan sekadar hafalan. Tujuannya supaya kamu lulus sebagai orang yang pintar sekaligus punya karakter dan paham perannya sebagai warga negara.',pts:[
  `<b>Ada dasar hukumnya.</b> UU No. 12 Tahun 2012 tentang Pendidikan Tinggi mewajibkan PKn diajarkan di kampus, bersama Pendidikan Agama, Pancasila, dan Bahasa Indonesia. Jadi PKn memang mata kuliah wajib.`,
  `<b>Membentuk good citizen (warga negara yang baik).</b> Mahasiswa nanti jadi pemimpin dan profesional. Keahlian saja tidak cukup, perlu karakter, tanggung jawab, dan sadar hak serta kewajiban. ${e('desainer yang jago tapi suka menjiplak karya orang tetap bermasalah')}`,
  `<b>Menumbuhkan wawasan kebangsaan dan bela negara.</b> Artinya paham Pancasila, UUD 1945, NKRI, dan Bhinneka Tunggal Ika, supaya bangsa tidak mudah terpecah hanya karena beda suku atau agama.`,
  `<b>Melatih sikap demokratis dan kritis.</b> Berani berpendapat dengan sopan, menghargai pendapat yang berbeda, dan ikut berpartisipasi tanpa memaksakan kehendak.`,
  `<b>Menjawab tantangan global.</b> Globalisasi membawa budaya dan ideologi asing, sikap individualistis, dan krisis identitas. PKn menguatkan jati diri bangsa.`,
  `<b>Peran PKn di era digital (bisa dipakai sebagai contoh jawaban):</b>
   <br>1. Hoaks dan ujaran kebencian: cek kebenaran info sebelum share, patuhi UU ITE.
   <br>2. Radikalisme dan intoleransi online: nilai Pancasila jadi saringan konten yang memecah belah.
   <br>3. Cyberbullying dan pelanggaran privasi: sila ke-2, hormati hak orang lain di dunia maya.
   <br>4. Aspirasi: sampaikan lewat petisi online atau kanal pengaduan resmi, bukan provokasi.`
 ],ingat:'Pola jawaban "mengapa PKn penting": hukum, karakter, kebangsaan, demokrasi, tantangan global.'},
 {id:'pkn2',t:'Pancasila dan konflik',gist:'Konflik terjadi saat nilai Pancasila tidak dijalankan. Jadi setiap sila bisa dipakai untuk membaca penyebab sebuah konflik.',pts:[
  `<b>Cara menjawab soal penyebab konflik:</b> ambil satu sila, lalu tulis perilaku yang melanggarnya. Itulah penyebab konfliknya (lihat tabel di bawah).`,
  `<b>Sila pedoman penyelesaian konflik.</b> Pada dasarnya kelima sila, tapi yang paling utama adalah <b>sila ke-4 (musyawarah mufakat)</b>: selesaikan lewat dialog, bukan kekerasan.`,
  `Sila lainnya membantu begini: sila ke-2 mengajarkan saling menghormati dan tidak main hakim sendiri; sila ke-3 mengingatkan kepentingan bangsa di atas golongan; sila ke-1 mendorong toleransi; sila ke-5 menjamin penyelesaian yang adil bagi semua pihak.`,
  `<b>Contoh konflik terbaru:</b>
   <br>1. Rempang Eco-City (Batam): sengketa lahan antara pembangunan dan masyarakat adat.
   <br>2. Penolakan atau masalah izin rumah ibadah di beberapa daerah.
   <br>3. Tawuran antarpelajar dan antarwarga.
   <br>4. Demo besar Agustus 2025 karena kekecewaan pada kebijakan dan tunjangan anggota DPR.
   <br>5. Hoaks dan ujaran kebencian di medsos saat politik memanas.`,
  `<b>Tips:</b> pilih satu atau dua contoh yang paling kamu pahami, dan cek berita terbaru supaya contohmu tidak ketinggalan.`
 ],vis:()=>[V.table('Penyebab konflik per sila',['Sila','Penyebab konflik'],[
  ['1 Ketuhanan','Intoleransi, memaksakan keyakinan, menolak rumah ibadah, penistaan agama'],['2 Kemanusiaan','Diskriminasi, kekerasan, perundungan, pelanggaran HAM, kurang empati'],['3 Persatuan','Fanatik suku/golongan, sentimen SARA, separatisme'],['4 Kerakyatan','Abaikan musyawarah, memaksa kehendak, kebijakan tanpa melibatkan rakyat, politik uang'],['5 Keadilan sosial','Kesenjangan ekonomi, hukum tidak adil, sengketa lahan, korupsi']])]},
 {id:'pkn3',t:'Perubahan UUD 1945',gist:'UUD 1945 diubah 4 kali pada 1999–2002 (era Reformasi). Jawabannya: ya, perubahan itu memperkuat demokrasi, tapi praktiknya masih punya masalah.',pts:[
  `<b>Kenapa dibilang memperkuat demokrasi? Ada 5 alasan:</b>
   <br>1. <b>Kekuasaan presiden dibatasi:</b> maksimal 2 periode (Pasal 7). Dulu tidak jelas, jadi bisa berkuasa sangat lama.
   <br>2. <b>Rakyat memilih langsung</b> presiden dan wapres (Pasal 6A). Dulu dipilih MPR.
   <br>3. <b>Saling mengawasi antar lembaga (checks and balances):</b> DPR memegang pembuatan UU (Pasal 20), dan ada lembaga baru seperti Mahkamah Konstitusi dan Komisi Yudisial.
   <br>4. <b>HAM dijamin lebih lengkap</b> (Pasal 28A–28J).
   <br>5. <b>Daerah lebih terwakili:</b> ada DPD dan otonomi daerah.`,
  `<b>Kelemahannya:</b> politik uang, oligarki (kekuasaan dipegang segelintir orang kaya), dan korupsi masih terjadi. Artinya aturannya sudah bagus, tapi kualitas demokrasi tetap bergantung pada pelaksanaannya.`,
  `<b>Pasal cadangan</b> kalau diminta lima pasal: Pasal 1 ayat (3) negara hukum, Pasal 22E pemilu, Pasal 22C DPD, Pasal 24B Komisi Yudisial.`
 ],ingat:'Angka kunci: 4 kali diubah, tahun 1999–2002, maksimal 2 periode, Pasal 6A pemilihan langsung, Pasal 24C Mahkamah Konstitusi.',vis:()=>[V.table('5 pasal kunci',['Pasal','Isinya'],[
  ['1 ayat (2)','Kedaulatan di tangan rakyat (dulu sepenuhnya dipegang MPR)'],['6A','Presiden dan Wapres dipilih langsung oleh rakyat'],['7','Masa jabatan 5 tahun, boleh dipilih lagi hanya satu kali'],['24C','Dibentuk Mahkamah Konstitusi (menguji UU terhadap UUD, dll.)'],['28A–28J','Jaminan hak asasi manusia yang rinci']])]},
 {id:'pkn4',t:'Negara dan warga negara',gist:'Negara dan warga saling membutuhkan: negara melindungi dan menyejahterakan, warga menaati hukum dan ikut membela negara.',pts:[
  `<b>Hak dan kewajiban timbal balik.</b> Negara wajib melindungi, menyejahterakan, dan menjamin hak warga. Warga wajib menaati hukum, membayar pajak, dan membela negara.`,
  `<b>Kedaulatan rakyat.</b> Rakyat pemilik kekuasaan tertinggi, pemerintah hanya menjalankan mandat rakyat (Pasal 1 ayat 2). ${e('seperti pemilik rumah dan pengurus rumah: pengurus bekerja atas nama pemilik')}`,
  `<b>Teori kontrak sosial</b> (Hobbes, Locke, Rousseau). Negara ada karena warga sepakat membentuknya demi melindungi kepentingan bersama.`,
  `<b>Negara hukum</b> (Pasal 1 ayat 3). Hubungan negara dan warga diatur hukum, jadi negara tidak boleh bertindak sewenang-wenang.`,
  `<b>Kekeluargaan dan gotong royong</b> sesuai Pancasila: negara dan warga satu kesatuan yang saling mendukung.`,
  `<b>Status kewarganegaraan</b> diatur Pasal 26. Dari situ ditentukan siapa yang punya hak dan kewajiban sebagai warga negara.`,
  `<b>Contoh negara kepada warga (hak warga):</b> pendidikan (Pasal 31, misalnya KIP), jaminan kesehatan (BPJS), layanan KTP dan paspor, perlindungan hukum, fasilitas umum.`,
  `<b>Contoh warga kepada negara (kewajiban):</b> membayar pajak, ikut pemilu, menaati hukum, bela negara (Pasal 27 ayat 3 dan Pasal 30).`
 ]},
 {id:'pkn5',t:'Demokrasi Pancasila',gist:'Demokrasi Pancasila adalah demokrasi "dari, oleh, untuk rakyat" ala Lincoln, ditambah musyawarah dan nilai-nilai Pancasila.',pts:[
  `<b>Menurut Lincoln</b> (Pidato Gettysburg, 1863), demokrasi adalah pemerintahan dari rakyat, oleh rakyat, dan untuk rakyat.
   <br>1. <b>Dari rakyat:</b> kekuasaan berasal dari rakyat, pemimpin adalah wakil rakyat.
   <br>2. <b>Oleh rakyat:</b> rakyat ikut menjalankan pemerintahan, misalnya lewat pemilu.
   <br>3. <b>Untuk rakyat:</b> tujuannya kesejahteraan rakyat, bukan segelintir elite.`,
  `<b>Relevan dengan Indonesia:</b> "dari rakyat" sesuai Pasal 1 ayat (2); "oleh rakyat" karena kita memilih presiden, DPR, DPD, dan kepala daerah secara langsung; "untuk rakyat" sesuai sila ke-5 dan tujuan negara di Pembukaan UUD 1945 (memajukan kesejahteraan umum, mencerdaskan kehidupan bangsa).`,
  `<b>Kekhasan Demokrasi Pancasila:</b> tidak hanya suara terbanyak, tapi juga hikmat kebijaksanaan dan musyawarah mufakat (sila ke-4). Kebebasan tidak boleh bertentangan dengan nilai Ketuhanan, kemanusiaan, persatuan, dan keadilan sosial.`,
  `<b>Tantangan:</b> politik uang, korupsi, dan oligarki membuat prinsip "untuk rakyat" belum sepenuhnya terwujud. Karena itu warga, termasuk mahasiswa, perlu ikut mengawasi secara kritis.`
 ],vis:()=>[V.cols('Of, by, for the people',[['Dari rakyat','Kekuasaan bersumber dari rakyat'],['Oleh rakyat','Rakyat ikut menjalankan, misal lewat pemilu'],['Untuk rakyat','Tujuannya kesejahteraan rakyat']])]}
],
pk:[
 {id:'pk1',t:'Pengantar perilaku konsumen',gist:'Perilaku konsumen adalah ilmu tentang bagaimana orang memutuskan membeli, memakai, dan menilai sesuatu, mulai dari sebelum beli sampai sesudahnya.',pts:[
  `<b>Beda "pembeli" dan "konsumen".</b> Dulu yang dipelajari hanya saat bayar di kasir. Sekarang dilihat sebagai proses panjang: <b>sebelum beli</b> (sadar butuh, cari info, baca review), <b>saat beli</b> (pengalaman belanja, tampilan aplikasi, kemudahan checkout), <b>sesudah beli</b> (puas, kasih bintang 5, rekomendasi, atau kecewa dan komplain). ${e('kamu cari promo di e-commerce, checkout, lalu menulis review: itu satu rangkaian')}`,
  `<b>Definisi:</b> studi tentang cara individu, kelompok, dan organisasi memilih, membeli, memakai, dan menilai produk, jasa, atau ide untuk memenuhi kebutuhan dan keinginan. Buat desainer: desain adalah stimulus (rangsangan) yang direspons konsumen.`,
  `<b>Lima era cara pandang pemasaran:</b>
   <br>1. <b>Produksi (1910-an):</b> fokus membuat murah dan banyak. Henry Ford: pilih warna apa saja asal hitam.
   <br>2. <b>Produk (1930-an):</b> fokus membuat fitur terbaik, tapi lupa apa yang sebenarnya dibutuhkan orang (marketing myopia).
   <br>3. <b>Penjualan (1950-an):</b> mendorong jual apa yang sudah dibuat, bukan membuat apa yang diinginkan pasar.
   <br>4. <b>Pemasaran (1950-an sampai kini):</b> mulai dari kebutuhan konsumen yang belum terpenuhi.
   <br>5. <b>Pemasaran kemasyarakatan (kini):</b> memuaskan konsumen sambil menjaga kesejahteraan masyarakat. ${e('merek yang transparan soal keberlanjutan lingkungan')}`,
  `<b>Web 2.0 dan Big Data.</b> Dulu iklan satu arah (perusahaan ke audiens), sekarang dua arah. Konsumen dapat banyak info dan produk yang sesuai selera. Pemasar dapat data: klik, lokasi, preferensi. Harga yang dibayar konsumen adalah privasi.`,
  `<b>UGC (User-Generated Content):</b> konten buatan konsumen, seperti review, video unboxing, dan keluhan viral. Sering lebih dipercaya daripada iklan yang mahal. Konsumen jadi ko-kreator dan menuntut merek yang jujur (brand authenticity).`,
  `<b>Empat ilmu yang dipakai untuk memahami konsumen:</b> psikologi (isi kepala individu: persepsi, motivasi, kepribadian, memori), sosiologi (pengaruh kelompok, kelas sosial, FOMO), antropologi (budaya, ritual, subkultur), komunikasi (simbol, bujukan, penyampaian pesan).`
 ],ingat:'Urutan evolusi: Produksi, Produk, Penjualan, Pemasaran, Kemasyarakatan.',vis:()=>[V.flow('Alur keputusan konsumen',['Sadar butuh','Cari info','Bandingkan','Beli','Evaluasi']),V.cols('Empat ilmu di baliknya',[['Psikologi','Pikiran individu'],['Sosiologi','Kelompok, FOMO'],['Antropologi','Budaya, ritual'],['Komunikasi','Pesan dan bujukan']])]},
 {id:'pk2',t:'Motivasi: dasar',gist:'Orang membeli karena ada "jarak" antara keadaan sekarang dan keadaan yang diinginkan. Jarak itu bikin tidak nyaman, lalu mendorong kita bertindak.',pts:[
  `<b>Alur motivasi:</b> ada kesenjangan, muncul ketegangan, terdorong bertindak, melakukan pembelian, lalu lega. ${e('HP lemot (kenyataan) padahal ingin lancar (harapan), jadi gelisah, cari HP baru, beli, lalu tenang')}`,
  `<b>Kebutuhan biogenik</b> adalah kebutuhan bawaan untuk bertahan hidup (lapar, haus). <b>Kebutuhan psikogenik</b> dipelajari dari lingkungan (harga diri, gengsi, kasih sayang, kekuasaan, pencapaian).`,
  `<b>Utilitarian</b> artinya membeli karena fungsi dan logika. <b>Hedonik</b> artinya membeli karena rasa dan emosi. ${e('beli motor karena irit (utilitarian) lawan karena suara dan gayanya keren (hedonik)')}`,
  `<b>Approach</b> artinya terdorong mendekati sesuatu yang positif (olahraga supaya sehat). <b>Avoidance</b> artinya terdorong menghindari sesuatu yang negatif (olahraga supaya tidak sakit).`,
  `<b>Tiga konflik motivasi:</b>
   <br>1. <b>Approach-approach:</b> memilih dua hal yang sama-sama diinginkan. Pemasar menonjolkan keunggulan satu pilihan.
   <br>2. <b>Approach-avoidance:</b> mau tapi takut akibatnya, misal ingin makanan manis tapi takut gemuk. Solusi pemasar: kompromi seperti pemanis rendah kalori.
   <br>3. <b>Avoidance-avoidance:</b> terjebak di dua pilihan buruk, misal membiarkan mobil rusak atau mengambil kredit mahal. Pemasar meminimalkan rasa sakitnya.`,
  `<b>Disonansi kognitif:</b> rasa ragu dan tidak nyaman setelah membeli barang mahal ("jangan-jangan salah beli"). Orang lalu mencari pembenaran. Pemasar membantu lewat panduan pemakaian, pesan yang meyakinkan, dan layanan pelanggan.`,
  `<b>Tujuh cara orang menghadapi frustrasi</b> (saat gagal mencapai tujuan):
   <br>1. <b>Agresi:</b> marah, misalnya memboikot merek.
   <br>2. <b>Rasionalisasi:</b> mencari alasan ("aku kurang latihan" atau "skor tinggi tidak penting kok").
   <br>3. <b>Regresi:</b> bertingkah kekanak-kanakan, misal rebutan barang diskon.
   <br>4. <b>Withdrawal:</b> mundur dari situasi.
   <br>5. <b>Proyeksi:</b> menyalahkan benda atau orang lain.
   <br>6. <b>Daydreaming:</b> melamun tentang hidup yang lebih baik.
   <br>7. <b>Identifikasi:</b> merasa diwakili orang atau iklan, lalu memakai solusi yang ditawarkan.`
 ],ingat:'Tujuh defense: Agresi, Rasionalisasi, Regresi, Withdrawal, Proyeksi, Daydreaming, Identifikasi.',vis:()=>[V.flow('Siklus motivasi',['Ada jarak','Tegang','Terdorong','Beli','Lega'])]},
 {id:'pk2b',t:'Motivasi: teori dan keterlibatan',gist:'Tiga teori terkenal yang menjelaskan apa sebenarnya yang kita cari saat membeli, plus soal seberapa peduli kita pada sebuah produk.',pts:[
  `<b>Maslow:</b> kebutuhan manusia bertingkat. Pemenuhan dimulai dari bawah.
   <br>1. Fisiologis: makan, minum, tidur.
   <br>2. Keamanan: perlindungan, stabilitas (misal asuransi).
   <br>3. Sosial: diterima, punya teman (misal nongkrong).
   <br>4. Ego/esteem: status dan percaya diri (misal barang bermerek).
   <br>5. Aktualisasi diri: sukses dan mewujudkan potensi.
   <br>Satu produk bisa memuaskan kelimanya, contoh berkebun: dapat makanan, rasa aman, hasil panen untuk dibagi, keindahan, dan ketenangan batin.`,
  `<b>McClelland (kebutuhan yang dipelajari):</b> kebutuhan akan <b>pencapaian</b> (ingin sukses), <b>kekuasaan</b> (mengendalikan lingkungan), <b>afiliasi</b> (ingin diterima kelompok dan takut ditolak), dan <b>keunikan</b> (ingin menunjukkan identitas pribadi).`,
  `<b>Freud:</b> pikiran punya tiga bagian. <b>Id</b> ingin puas sekarang tanpa peduli akibat. <b>Superego</b> adalah hati nurani dan rem moral. <b>Ego</b> jadi wasit di antara keduanya. ${e('Id ingin dessert mahal sekarang, Superego bilang jangan boros, Ego memilih porsi kecil')} Produk dibeli sebagai kompromi yang bisa diterima secara sosial.`,
  `<b>Mood dan emotion.</b> Mood adalah perasaan ringan dan sementara, iklan lebih dinilai positif saat kita sedang senang (mood congruency). Emotion adalah reaksi kuat karena pemicu yang jelas. Strategi: negative state relief (berdonasi supaya mood membaik) dan sadvertising (iklan sedih yang menguras air mata).`,
  `<b>Involvement (keterlibatan)</b> adalah seberapa penting dan relevan sebuah produk bagi konsumen. Rendah: beli karena kebiasaan (inersia). Tertinggi: fanatik, produk jadi bagian identitas (produk kultus, misal kolektor sneakers).`,
  `<b>Tiga cara pemasar menaikkan keterlibatan:</b> lewat <b>produk</b> (risiko yang dirasakan, boleh mendesain sendiri), lewat <b>pesan</b> (cerita yang menyedot perhatian, visual mengejutkan), dan lewat <b>situasi</b> (rekomendasi real-time, toko yang jadi pengalaman).`
 ],vis:()=>[
  V.pyr('Hierarki kebutuhan Maslow',[['Aktualisasi diri','Sukses, kuasa',44],['Ego (esteem)','Status, percaya diri',58],['Sosial','Dihormati, berteman',72],['Keamanan','Perlindungan, stabilitas',86],['Fisiologis','Air, tidur, makanan',100]]),
  V.g2('Matriks motivasi dan keterlibatan',{x:['Motivasi rendah','Motivasi tinggi'],y:['Peduli tinggi','Peduli rendah'],c:[
   ['Pencari nilai','Butuh rendah, tapi teliti banding harga dan cari diskon'],['Evangelis merek','Butuh tinggi dan peduli: loyal, rela bayar lebih'],['Inersia','Beli yang itu-itu saja, autopilot'],['Impulsif','Beli cepat demi kepuasan sesaat']]})]},
 {id:'pk3',t:'Persepsi: dari stimulus ke ingatan',gist:'Persepsi adalah cara otak memilih dan memaknai rangsangan. Konsumen melihat versinya sendiri, bukan kenyataan apa adanya.',pts:[
  `<b>Banjir rangsangan.</b> Di swalayan modern ada lebih dari 30.000 produk yang bersaing mencari perhatian. Otak menyaring sebagian besar supaya tidak kelelahan. Tugas pemasar: bagaimana pesan bisa lolos dari saringan itu.`,
  `<b>Lima tahap persepsi:</b>
   <br>1. <b>Paparan:</b> stimulus mulai terdeteksi.
   <br>2. <b>Perhatian:</b> lolos dari saringan, mulai diperhatikan.
   <br>3. <b>Pemahaman:</b> konsumen menafsirkan maknanya.
   <br>4. <b>Penerimaan:</b> pesan berhasil memengaruhi.
   <br>5. <b>Retensi:</b> tersimpan di ingatan.`,
  `<b>Pemasaran lewat lima indra:</b> <b>penglihatan</b> (warna cerah membangkitkan gairah, warna dingin menenangkan), <b>pendengaran</b> (tempo musik lambat membuat orang betah lama di toko), <b>penciuman</b> (aroma terhubung dengan emosi dan memori, misal aroma kopi), <b>pengecapan</b> (rasa), <b>sentuhan</b> (pembeli yang boleh menyentuh produk jadi lebih yakin menilai).`,
  `<b>Hukum Weber dan JND (just noticeable difference).</b> JND adalah perubahan terkecil yang bisa disadari. Semakin besar nilai awal, semakin besar perubahan yang dibutuhkan agar terasa. ${e('turun Rp 600 dari harga Rp 6.000 (10%) terasa, tapi turun Rp 600 dari Rp 60.000 (1%) tidak terasa')}
   <br><b>Di bawah JND</b> = sengaja tidak terasa: kemasan dikecilkan diam-diam, atau logo diperbarui sedikit demi sedikit supaya pelanggan tidak kaget.
   <br><b>Di atas JND</b> = sengaja terasa: diskon cukup besar (minimal sekitar 20%) atau fitur baru yang jelas terlihat.`,
  `<b>Perceptual vigilance:</b> otak memperhatikan hal yang relevan dengan kebutuhan kita saat ini (lapar, jadi mudah melihat iklan makanan). <b>Perceptual defense:</b> otak menolak hal yang mengancam (perokok mengabaikan gambar peringatan di bungkus rokok).`,
  `<b>Cara menembus saringan lewat kontras:</b> <b>ukuran</b> (jauh lebih besar dari sekitar), <b>warna</b> (berbeda dari lingkungan), <b>posisi</b> (di tempat tak terduga, misal ambient media di jalan), <b>kebaruan</b> (menyimpang dari yang diharapkan, ada kejutan).`
 ],ingat:'Mau diam-diam, tetap di bawah JND. Mau ketahuan, lewati JND.',vis:()=>[V.flow('Perjalanan stimulus',['Paparan','Perhatian','Pemahaman','Penerimaan','Retensi'])]},
 {id:'pk3b',t:'Persepsi: makna dan risiko',gist:'Setelah stimulus ditangkap, otak menyusun maknanya sendiri, sering lewat jalan pintas. Ini yang membentuk penilaian konsumen terhadap sebuah merek.',pts:[
  `<b>Psikologi Gestalt:</b> otak menyatukan potongan menjadi pola yang bermakna.
   <br>1. <b>Figure-ground:</b> yang menonjol (figure) jadi fokus, sisanya jadi latar. ${e('iklan yang dibuat jelas fokusnya supaya tidak diabaikan')}
   <br>2. <b>Closure:</b> otak otomatis melengkapi gambar atau pesan yang tidak utuh. ${e('teaser poster yang sengaja dibuat setengah')}
   <br>3. <b>Grouping:</b> benda yang berdekatan atau mirip dianggap satu kelompok. ${e('produk ditata dengan gaya target pasarnya')}`,
  `<b>Semiotika:</b> ilmu tentang tanda dan makna. Ada tiga bagian: tanda atau simbol, objek (produk), dan makna di benak konsumen (interpretant). ${e('karakter koboi (tanda) dipasang pada rokok Marlboro (objek) menghasilkan kesan maskulin dan tangguh (makna)')} Merek kuat menjual maknanya, bukan hanya fiturnya.`,
  `<b>Tiga bias penilaian:</b>
   <br>1. <b>Kesan pertama</b> bersifat awet. Meluncurkan produk yang belum matang bisa fatal.
   <br>2. <b>Stereotyping:</b> menilai dari isyarat sederhana seperti penampilan, istilah, atau negara asal produk.
   <br>3. <b>Halo effect:</b> satu hal bagus membuat keseluruhan dinilai bagus. Ini dasar brand extension dan licensing.`,
  `<b>Isyarat intrinsik</b> adalah atribut fisik produk (rasa, tekstur, warna, ukuran), sulit dinilai sebelum membeli. <b>Isyarat ekstrinsik</b> adalah hal di luar produk (harga, citra merek, reputasi toko, kemasan), dipakai sebagai jalan pintas saat orang tidak punya waktu atau keahlian. Kemasan ibarat billboard mini di rak toko. ${e('isi pemanis yang sama bisa terasa beda kalau kemasannya diubah dari minimalis menenangkan menjadi vibran dan ceria')}`,
  `<b>Risiko yang dirasakan (perceived risk)</b> dan solusi pemasar:
   <br>1. <b>Fungsional/fisik</b> ("bekerja dan aman tidak?"): edukasi, garansi uang kembali, sampel gratis.
   <br>2. <b>Finansial</b> ("sepadan dengan harganya?"): harga yang menandakan kualitas dan reputasi toko.
   <br>3. <b>Psikologis/sosial</b> ("kata orang gimana?"): brand loyalty, endorsement, merek yang cocok dengan identitas target.`,
  `<b>Positioning</b> adalah posisi merek di pikiran konsumen, bukan apa yang dilakukan pada produk. Dipetakan lewat perceptual mapping, misal sumbu ekonomis lawan premium dan tradisional lawan trendi.`
 ],vis:()=>[V.cols('Tiga risiko dan solusinya',[['Fungsional/fisik','Garansi, sampel gratis'],['Finansial','Harga sinyal kualitas, toko terpercaya'],['Sosial/psikologis','Endorser, loyalitas merek']])]},
 {id:'pk4',t:'Konsep diri',gist:'Konsep diri adalah gambaran tentang "aku ini siapa". Banyak pembelian dilakukan untuk membentuk atau menunjukkan gambaran itu.',pts:[
  `<b>Tiga sisi konsep diri:</b> <b>isi</b> (atribut yang dimiliki, misal pintar atau menarik secara fisik), <b>positivitas</b> (seberapa tinggi menilai diri, atau self-esteem), <b>akurasi</b> (seberapa sesuai dengan kenyataan, sering terdistorsi filter media sosial).`,
  `<b>Empat teori pembentukan konsep diri:</b> self-appraisal (diterima atau ditolak masyarakat), reflected appraisal atau looking-glass self (terbentuk dari penghargaan orang lain), social comparison (membandingkan diri dengan orang lain), biased scanning (cara pandang terhadap lingkungan).`,
  `<b>Looking-glass self:</b> kita menampilkan diri (outfit, gaya hidup, opini), masyarakat merespons (perhatian, pujian, like), lalu kita menyesuaikan diri. Orang yang self-monitoring-nya tinggi lebih mungkin membeli sesuatu demi menghindari malu di depan umum.`,
  `<b>Perspektif dramaturgical:</b> hidup seperti teater, kita aktor dengan banyak peran dan produk adalah propertinya. ${e('peran mahasiswa rajin (kacamata anti-radiasi, MacBook, kopi), peran eco-warrior (tote bag, tumbler, transportasi umum)')}`,
  `<b>Extended self:</b> barang yang kita miliki dianggap bagian dari diri, di empat level: individu (pakaian, ponsel), keluarga (rumah, furnitur), komunitas (lingkungan, kota asal), grup (fandom, almamater, tim olahraga). <b>Enclothed cognition:</b> makna pakaian memengaruhi perilaku pemakainya. <b>Posing power:</b> postur tubuh memengaruhi perasaan.`,
  `<b>Pergeseran gender:</b> dari sex-typed marketing (pink lawan biru, label "for men" dan "for women") ke androgyny dan fluiditas (palet unisex, kosmetik pria, label gender dihapus). Ada juga produk gender-bending, misalnya kosmetik pria atau senjata dengan warna pink untuk wanita.`,
  `<b>Body image:</b> standar cantik dibentuk budaya dan berbeda di tiap negara (Global Photoshop Project membuktikan itu). Pemasar memanfaatkan celahnya lewat <b>vanity sizing</b> (label ukuran dibuat lebih kecil dari aslinya supaya pembeli senang) dan <b>social comparison trap</b> (melihat model dan influencer terus-menerus menurunkan kepuasan pada tubuh sendiri lalu memicu belanja). Sisi gelapnya: obsesi berlebihan sampai bedah plastik.`
 ],ingat:'Empat versi diri: actual, ideal, social, ideal social. Ditambah avoidance self (diri yang tidak diinginkan).',vis:()=>[V.g2('Empat versi diri',{x:['Realita','Aspirasi'],y:['Mata saya','Mata orang'],c:[['Actual self','Diri saya yang sebenarnya'],['Ideal self','Diri yang ingin saya jadi'],['Social self','Saya merasa orang melihat saya begini'],['Ideal social self','Saya ingin orang melihat saya begini']]}),`<p class="note"><b>Avoidance self:</b> siapa yang tidak kamu inginkan. Contoh: sengaja makan junk food untuk memberontak dari identitas sehat.</p>`]},
 {id:'pk5',t:'Personality, lifestyle, value',gist:'Demografi hanya menjawab SIAPA yang membeli. Personality, lifestyle, dan value menjawab MENGAPA mereka membeli.',pts:[
  `<b>Contoh kenapa perlu:</b> dua mahasiswa sama-sama umur 20 dan uang jajan Rp 2 juta bisa memilih barang yang sangat berbeda. Perbedaannya ada di nilai hidup (values), cara memakai waktu dan uang (lifestyle), dan cara berpikir (personality).`,
  `<b>Teori Freud untuk pemasaran:</b> motif bawah sadar (konsumen sering tidak bisa menjelaskan alasan asli belinya), simbolisasi produk (kompromi Id dan Superego), dan riset motivasi yang dipopulerkan Dr. Ernest Dichter pada 1950-an.`,
  `<b>Neo-Freudian, Karen Horney (model CAD):</b> <b>Compliant</b> ingin dicintai dan diterima. <b>Aggressive</b> ingin menang, berprestasi, berstatus. <b>Detached</b> ingin mandiri dan bebas dari aturan kelompok.`,
  `<b>Carl Jung dan brand personality:</b> kita memilih merek yang mencerminkan diri kita. Rebel (Harley-Davidson, Vans), Creator (Apple, Lego), Hero (Nike), Jester (Old Spice, M&amp;Ms, Skittles), Lover (Chanel, Godiva).`,
  `<b>Trait theory, Big Five (OCEAN):</b>
   <br>1. <b>Openness:</b> suka hal baru, misal edisi terbatas.
   <br>2. <b>Conscientiousness:</b> teliti, riset berhari-hari, beli yang awet.
   <br>3. <b>Extroversion:</b> belanja untuk nongkrong, rentan FOMO.
   <br>4. <b>Agreeableness:</b> loyal pada merek ramah lingkungan atau punya misi sosial.
   <br>5. <b>Neuroticism:</b> retail therapy, belanja impulsif saat stres.`,
  `<b>Kerangka Aaker (5 dimensi kepribadian merek):</b> Sincerity (tulus), Excitement (energik), Competence (andal), Sophistication (elegan), Ruggedness (tangguh).`,
  `<b>Lifestyle:</b> orang jarang membeli barang terpisah, melainkan satu paket pelengkap (product constellation), misalnya starter pack "anak senja": tote bag, kopi slow bar, kamera analog, musik folk. Co-branding menggabungkan dua merek agar maknanya saling menular.`,
  `<b>Psikografis</b> (mengapa mereka membeli) melengkapi demografi (siapa mereka). Alatnya <b>AIO</b>: Activities (apa yang dilakukan), Interests (apa yang menarik perhatian), Opinions (pandangan tentang dunia). Hasilnya dipakai menyusun buyer persona.`,
  `<b>VALS:</b> Thinkers (fokus ide dan fungsi), Achievers (karier dan status), Makers (praktis, DIY), Experiencers (impulsif, suka pengalaman, target pasar Gen Z).`,
  `<b>Nilai inti dan means-end chain:</b> kita sebenarnya membeli tujuan akhir. ${e('sepatu lari ultralight (produk), sol empuk (atribut), kaki tidak sakit dan bisa lari jauh (manfaat), kesehatan dan kebebasan (nilai inti)')}`,
  `<b>Tren nilai:</b> bergeser dari materialisme (status = banyak barang mewah, fast fashion) ke minimalisme dan pengalaman (decluttering, konser dan traveling, thrifting, produk ramah lingkungan).`
 ],ingat:'Singkatan: CAD (Horney), OCEAN (Big Five), AIO (psikografis).',vis:()=>[V.cols('Horney: model CAD',[['Compliant','Ingin dicintai dan diterima'],['Aggressive','Ingin menang dan berstatus'],['Detached','Ingin mandiri dan bebas']]),V.cols('Aaker: 5 dimensi merek',[['Sincerity','Tulus, hangat, jujur'],['Excitement','Energik, berani'],['Competence','Andal, cerdas'],['Sophistication','Elegan, berkelas'],['Ruggedness','Tangguh, outdoorsy']])]},
 {id:'pk6',t:'Consumer learning',gist:'Konsumen belajar dari pengalaman, sering tanpa sadar. Merek memanfaatkannya untuk melatih kebiasaan beli kita.',pts:[
  `<b>Apa itu consumer learning?</b> Proses mendapat pengetahuan dan pengalaman belanja, lalu memakainya untuk membentuk perilaku di masa depan. Bisa sengaja (riset berhari-hari sebelum beli laptop) atau tidak sengaja (hafal jingle iklan mi instan karena sering lewat di timeline).`,
  `<b>Empat elemen utama:</b>
   <br>1. <b>Motives:</b> kebutuhan atau masalah yang belum terpenuhi.
   <br>2. <b>Cues:</b> petunjuk dari luar (iklan, kemasan, harga) yang mengarahkan dorongan.
   <br>3. <b>Responses:</b> reaksi kita (klik add to cart, beli, atau mengabaikan).
   <br>4. <b>Reinforcement:</b> hadiah atau kepuasan. Kalau puas, kita mengulang siklusnya.`,
  `<b>Kasus Febreze.</b> Awalnya gagal karena dijual sebagai penghilang bau (orang jarang sadar rumahnya bau). Setelah diposisikan sebagai hadiah wangi setelah selesai bersih-bersih, penjualannya meledak.`,
  `<b>Dua mazhab:</b> <b>behavioral</b> (insting, merespons stimulus secara otomatis, cocok untuk sabun, camilan) dan <b>cognitive</b> (berpikir, memproses informasi, cocok untuk laptop, mobil, asuransi).`,
  `<b>Classical conditioning:</b> belajar lewat asosiasi dan pengulangan, seperti anjing Pavlov yang mengeluarkan air liur saat mendengar bel. ${e('iklan Avocados from Mexico terus mengaitkan alpukat dengan lemak baik dan gaya hidup sehat, sampai otak otomatis menganggap makan alpukat sama dengan sehat')}`,
  `<b>Stimulus generalization dan discrimination.</b> Generalization (strategi me-too): pesaing sengaja meniru kemasan brand leader supaya konsumen menyamakan kualitasnya. Discrimination: leader tampil beda supaya tidak tertukar, misal Apple dengan kampanye "Think Different".`,
  `<b>Instrumental conditioning:</b> belajar dari konsekuensi (coba-coba lalu dapat hadiah). Positive reinforcement berupa diskon, poin loyalitas, atau pujian teman. <b>Shaping:</b> memberi hadiah sebelum perilaku utama terjadi. ${e('bonus saldo Rp 50.000 saat pertama kali mengunduh aplikasi e-commerce, supaya kamu mau mencoba belanja')}`,
  `<b>Observational learning:</b> belajar dengan mengamati orang lain (modeling). ${e('anak-anak melihat atlet makan sereal Wheaties lalu ikut makan; kamu menonton review skincare beauty vlogger lalu langsung checkout')}`,
  `<b>Involvement dan otak:</b> high involvement/thinking (mobil, laptop): riset dan baca review. High involvement/feeling (gaun pengantin, parfum mewah): emosi dan ego terlibat. Low involvement (tisu, sampo): kebiasaan, pilih merek yang paling sering dilihat. <b>Otak kiri</b> memproses teks, angka, logika. <b>Otak kanan</b> memproses gambar, warna, musik (passive learning seperti menonton TV).`,
  `<b>Hasil akhir:</b> brand loyalty (pelanggan setia yang menolak pindah meski pesaing kasih diskon) dan brand equity (nilai merek di otak konsumen, alasan orang rela bayar lebih mahal untuk iPhone).`
 ],ingat:'Empat elemen: Motives, Cues, Responses, Reinforcement. Tiga jenis belajar: Classical, Instrumental, Observational.',vis:()=>[V.flow('Mesin pembelajaran',['Motive','Cue','Response','Reinforcement']),V.cols('Tiga jenis belajar',[['Classical','Asosiasi (jingle, Pavlov)'],['Instrumental','Hadiah (diskon, poin)'],['Observational','Meniru (review, endorser)']])]}
],

 {id:'idn1',t:'Budaya visual prasejarah',gist:'Seni zaman prasejarah adalah akar dari banyak motif dan makna desain Nusantara.',pts:[

  `<b>Lukisan gua:</b> manusia purba menggambar di dinding gua. Contohnya di Leang-Leang (Maros-Pangkep, Sulawesi Selatan): cap tangan dan gambar hewan buruan. Fungsinya diduga untuk ritual dan komunikasi.`,
  `<b>Tradisi megalitik (batu besar):</b> menhir (batu tegak), dolmen (meja batu), punden berundak (bangunan berundak), sarkofagus (peti batu), dan arca batu. Terkait pemujaan leluhur.`,
  `<b>Zaman logam:</b> nekara perunggu dan moko dihiasi motif geometris seperti spiral, pilin, meander, dan tumpal.`,
  `<b>Kenapa penting untuk desainer:</b> visual prasejarah berfungsi sebagai simbol kepercayaan dan penanda identitas kelompok, dan jadi sumber inspirasi motif desain Nusantara masa kini.`
 ]},

const quiz={run:null};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const allQ=()=>QB.map(([s,q,c,a,b,d,e])=>({s,q,o:[c,a,b,d],a:0,e})).concat(aiq);
function renderQuizSetup(){

$('#p-quiz').addEventListener('click',e=>{
  const k=e.target.closest('[data-qk]');if(k){const v=k.dataset.qk;quizSel=quizSel.includes(v)?quizSel.filter(x=>x!==v):[...quizSel,v];renderQuizSetup();return}
  const n=e.target.closest('[data-qn]');if(n){quizN=+n.dataset.qn;renderQuizSetup();return}
  if(e.target.id==='q-start')startQuiz();
  if(e.target.id==='q-gen')genFromSelection(e.target);
  const o=e.target.closest('[data-o]');if(o&&!o.disabled)answer(+o.dataset.o);
  if(e.target.id==='q-next')nextQ();
  if(e.target.id==='q-again'){quiz.run=null;renderQuizSetup()}
  if(e.target.id==='q-wrong')startQuiz(quiz.wrong);

function startQuiz(custom){
  let pool=custom||allQ().filter(q=>quizSel.includes(q.s));
  if(!pool.length){toast('Pilih minimal satu mapel yang punya soal.');return}
  pool=shuffle(pool);if(!custom&&quizN)pool=pool.slice(0,quizN);
  quiz.run={qs:pool.map(q=>({s:q.s,q:q.q,e:q.e,opts:shuffle(q.o.map((t,i)=>({t,ok:i===q.a})))})),i:0,score:0,picked:null,wrong:[],by:{}};
  renderQ();
}
function renderQ(){
  const r=quiz.run,q=r.qs[r.i];window.scrollTo(0,0);
  $('#p-quiz').innerHTML=`<div class="qbox s-${q.s}">
   <div class="row" style="justify-content:space-between"><span class="tag">${SUBJ[q.s].short}</span><span class="muted" style="font-size:14px">${r.i+1} / ${r.qs.length}</span></div>
   <div class="bar-p"><span style="width:${r.i/r.qs.length*100}%"></span></div>
   <div class="qtext">${esc(q.q)}</div>
   <div class="opts">${q.opts.map((o,i)=>`<button class="opt" type="button" data-o="${i}"><span class="l">${'ABCD'[i]}</span><span>${esc(o.t)}</span></button>`).join('')}</div>
   <div id="q-fb"></div></div>`;
}
function answer(i){
  const r=quiz.run,q=r.qs[r.i];if(r.picked!==null)return;r.picked=i;
  const ok=q.opts[i].ok;if(ok)r.score++;else r.wrong.push({s:q.s,q:q.q,e:q.e,o:q.opts.map(o=>o.t),a:q.opts.findIndex(o=>o.ok)});
  r.by[q.s]=r.by[q.s]||[0,0];r.by[q.s][1]++;if(ok)r.by[q.s][0]++;
  $$('#p-quiz .opt').forEach((b,j)=>{b.disabled=true;if(q.opts[j].ok)b.classList.add('ok');else if(j===i)b.classList.add('no')});
  $('#q-fb').innerHTML=`<div class="expl"><b>${ok?'Benar.':'Kurang tepat.'}</b> ${esc(q.e||'')}</div><div style="margin-top:12px"><button class="btn pri" type="button" id="q-next">${r.i+1<r.qs.length?'Lanjut':'Lihat skor'}</button></div>`;
  $('#q-next').scrollIntoView({block:'nearest',behavior:'smooth'});
}
function nextQ(){const r=quiz.run;r.picked=null;r.i++;if(r.i<r.qs.length)renderQ();else finish()}
function finish(){
  const r=quiz.run,pct=Math.round(r.score/r.qs.length*100);
  const keys=Object.keys(r.by);const key=keys.length===1?keys[0]:'campur';
  if(!(best[key]>=pct)){best[key]=pct;store.set('uts.best',best)}
  quiz.wrong=r.wrong.map(w=>({s:w.s,q:w.q,e:w.e,o:w.o,a:w.a}));
  $('#p-quiz').innerHTML=`<div class="qbox"><span class="eyebrow">Hasil</span><div class="score">${pct}<small class="muted" style="font-size:.35em">%</small></div>
   <p class="lead">${r.score} dari ${r.qs.length} soal benar. ${pct>=80?'Mantap, tinggal dijaga.':pct>=60?'Lumayan, ulangi yang salah.':'Baca materinya lagi, lalu coba lagi.'}</p>
   <div class="row">${keys.map(k=>`<span class="tag s-${k}">${SUBJ[k].short} ${r.by[k][0]}/${r.by[k][1]}</span>`).join('')}</div>
   <div class="row"><button class="btn pri" type="button" id="q-again">Quiz baru</button>${r.wrong.length?'<button class="btn" type="button" id="q-wrong">Ulangi yang salah</button>':''}</div>
   ${r.wrong.length?`<h3 style="margin-top:8px">Yang perlu diulang</h3>`+r.wrong.map(w=>`<div class="card s-${w.s}" style="display:flex;flex-direction:column;gap:6px"><b>${esc(w.q)}</b><div style="color:var(--good)">Jawaban: ${esc(w.o[w.a])}</div><div class="muted" style="font-size:14px">${esc(w.e||'')}</div></div>`).join(''):''}</div>`;
  quiz.run=null;
}

function myCtx(keys){const ns=notes.filter(n=>!keys||keys.includes(n.s));return ns.map(n=>'## Catatan: '+n.title+'\n'+n.text).join('\n\n').slice(0,40000)}
const SYS='Kamu adalah tutor belajar untuk mahasiswa DKV yang sedang menghadapi UTS. Jawab dalam Bahasa Indonesia yang santai tapi akurat, singkat, sederhana, dengan contoh dari kehidupan Gen Z. Acuan utama adalah materi di bawah. Kalau pertanyaan di luar materi, jawab dengan pengetahuan umum dan sebutkan itu di luar materi. Kalau tidak yakin, katakan tidak yakin. Jangan membuat kutipan atau data palsu.';
function buildMsgs(hist){
  let h=hist.slice(-12);while(h.length&&h[0].role!=='user')h=h.slice(1);
  const use=$('#ctx')&&$('#ctx').checked;
  const ctx=use?('\n\n# MATERI\n'+builtinCtx(['pkn','pk','idn'])+'\n\n# CATATAN MAHASISWA\n'+(myCtx()||'(kosong)')):'';
  return h.map((m,i)=>i===0?{role:'user',content:SYS+ctx+'\n\n# PERTANYAAN\n'+m.content}:m);
}
const chat=[];let ctl=null;
function renderAI(){
  $('#p-ai').innerHTML=`<div style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow">Tutor pribadi</span><h2>Tanya AI</h2><p class="lead">Menjawab dari materi di web ini dan catatanmu.</p></div>
   <div class="card chat" style="max-width:820px">
    <div class="log" id="log" aria-live="polite"><div class="msg a">Halo. Tanya apa saja soal PKn atau Perilaku Konsumen. Bisa juga minta aku menguji kamu.</div></div>
    <div class="sugs" id="sugs">${['Bedanya classical dan instrumental conditioning?','Jelaskan JND dengan contoh','Uji aku 3 soal PKn, satu per satu','Rangkum Maslow untuk dihafal'].map(s=>`<button type="button">${s}</button>`).join('')}</div>
    <label class="done-ok" style="font-weight:500"><input type="checkbox" id="ctx" checked>Pakai materi di web ini sebagai acuan</label>
    <div class="compose"><textarea id="chat-in" rows="1" placeholder="Tulis pertanyaanmu..." aria-label="Pertanyaan"></textarea><button class="btn pri" type="button" id="send">Kirim</button></div>
    <p class="muted" id="ai-state" style="font-size:13px"></p>
   </div>`;
  setAIState();chat.forEach(m=>addMsg(m.role==='user'?'u':'a',m.content));

function addMsg(cls,text){const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;$('#log').appendChild(d);$('#log').scrollTop=1e9;return d}
function setAIState(){const s=$('#ai-state');if(!s)return;s.textContent=SAMPLE?'AI aktif. Pertama kali dipakai, kamu akan diminta izin.':'AI belum tersedia di tampilan ini. Buka halaman lewat claude.ai dalam keadaan masuk akun.';$('#send').disabled=!SAMPLE}
const AIERR=e=>e&&e.code==='not_granted'?'Izin AI belum diberikan. Kirim lagi dan setujui permintaannya.':e&&e.code==='rate_limited'?'Terlalu banyak permintaan. Tunggu sebentar lalu coba lagi.':(e&&e.name==='AbortError')?'Dihentikan.':'Gagal menghubungi AI: '+((e&&e.message)||'coba lagi nanti.');
async function send(){
  const inp=$('#chat-in'),txt=inp.value.trim();
  if(ctl){ctl.abort();return}
  if(!txt||!SAMPLE)return;
  inp.value='';chat.push({role:'user',content:txt});addMsg('u',txt);
  const bub=addMsg('a','Mikir dulu...');ctl=new AbortController();$('#send').textContent='Stop';
  try{
    const r=await SAMPLE(buildMsgs(chat),{signal:ctl.signal,cache:false,onText:({text})=>{bub.textContent=text;$('#log').scrollTop=1e9}});
    bub.textContent=r.text;chat.push({role:'assistant',content:r.text});
  }catch(e){
    if(e&&e.text){bub.textContent=e.text;chat.push({role:'assistant',content:e.text})}
    else{bub.className='msg e';bub.textContent=AIERR(e);chat.pop()}
  }
  ctl=null;const sb=$('#send');if(sb)sb.textContent='Kirim';
}
$('#p-ai').addEventListener('click',e=>{
  if(e.target.id==='send')send();
  const s=e.target.closest('#sugs button');if(s){$('#chat-in').value=s.textContent;send()}
});
$('#p-ai').addEventListener('keydown',e=>{if(e.target.id==='chat-in'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});

async function genQuestions(text,label){
  if(!SAMPLE)throw {message:'AI belum tersedia di tampilan ini.'};
  const p='Buat 8 soal pilihan ganda (4 opsi) dalam Bahasa Indonesia dari materi berikut untuk persiapan UTS. Soal harus bisa dijawab dari materi. Balas HANYA dengan JSON array valid tanpa teks lain, bentuk: [{"q":"soal","o":["opsi","opsi","opsi","opsi"],"a":0,"e":"penjelasan singkat"}] dengan "a" = indeks jawaban benar (0 sampai 3). Variasikan posisi jawaban benar.\n\nMATERI ('+label+'):\n'+text.slice(0,24000);
  const r=await SAMPLE(p,{cache:false});
  const raw=r.text,i=raw.indexOf('['),j=raw.lastIndexOf(']');
  let arr;try{arr=JSON.parse(raw.slice(i,j+1))}catch(e){throw {message:'Format jawaban AI tidak terbaca. Coba lagi.'}}
  const ok=arr.filter(x=>x&&typeof x.q==='string'&&Array.isArray(x.o)&&x.o.length===4&&Number.isInteger(x.a)&&x.a>=0&&x.a<4).map(x=>({s:'ai',q:x.q,o:x.o.map(String),a:x.a,e:String(x.e||'')}));
  if(!ok.length)throw {message:'AI tidak menghasilkan soal yang valid. Coba lagi.'};
  aiq=aiq.concat(ok).slice(-120);store.set('uts.aiq',aiq);return ok.length;
}
async function genFromSelection(btn){
  const ks=quizSel.filter(k=>k!=='ai');if(!ks.length){toast('Pilih mapel dulu.');return}
  btn.disabled=true;btn.textContent='Membuat soal...';
  try{const n=await genQuestions(builtinCtx(ks)+'\n\n'+myCtx(ks),ks.map(k=>SUBJ[k].short).join(', '));toast(n+' soal AI ditambahkan.')}
  catch(e){toast(AIERR(e))}
  renderQuizSetup();
}

/* ---------- catatan ---------- */
function renderSaya(){
  $('#p-saya').innerHTML=`<div style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow">Tambah sendiri</span><h2>Catatan</h2><p class="lead">Tempel teks dari slide, PDF, atau catatan kuliah. Dipakai Tanya AI dan bisa dijadikan soal quiz. Tersimpan di browser ini.</p></div>
   <div class="card" style="display:flex;flex-direction:column;gap:12px;max-width:820px">
     <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))">
      <div><label class="eyebrow" for="n-s">Mapel</label><select id="n-s">${['pkn','pk','idn'].map(k=>`<option value="${k}">${SUBJ[k].name}</option>`).join('')}<option value="x">Mapel lain</option></select></div>
      <div><label class="eyebrow" for="n-t">Judul</label><input type="text" id="n-t" placeholder="mis. Slide IDN Project"></div>
     </div>
     <div><label class="eyebrow" for="n-b">Isi materi</label><textarea id="n-b" placeholder="Tempel teks materi di sini..."></textarea></div>
     <div class="row"><button class="btn pri" type="button" id="n-save">Simpan</button><label class="btn" for="n-f" style="cursor:pointer;display:inline-flex;align-items:center">Ambil dari file .txt / .md</label><input type="file" id="n-f" accept=".txt,.md,.csv,text/plain" hidden></div>
     <p class="note">Untuk PDF atau PPT: salin teksnya lalu tempel di sini.</p>
   </div>
   <div id="n-list" style="display:flex;flex-direction:column;gap:12px;max-width:820px"></div>`;
  renderNotes();
}
function renderNotes(){
  const l=$('#n-list');if(!l)return;
  l.innerHTML=notes.length?notes.map((n,i)=>`<div class="card mat s-${SUBJ[n.s]?n.s:'ai'}">
    <div class="head"><div><b>${esc(n.title)}</b> <span class="tag">${SUBJ[n.s]?SUBJ[n.s].short:'Lainnya'}</span></div>
    <div class="row"><button class="btn sm" type="button" data-a="sum" data-i="${i}">Ringkas AI</button><button class="btn sm" type="button" data-a="quiz" data-i="${i}">Buat soal</button><button class="btn sm" type="button" data-a="del" data-i="${i}">Hapus</button></div></div>
    <pre>${esc(n.text.slice(0,700))}</pre>${n.sum?`<div style="white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px;background:var(--surface2);border-radius:12px;padding:12px 14px">${esc(n.sum)}</div>`:''}</div>`).join(''):'<p class="muted">Belum ada catatan.</p>';
}
$('#p-saya').addEventListener('click',async e=>{
  if(e.target.id==='n-save'){
    const t=$('#n-t').value.trim()||'Tanpa judul',b=$('#n-b').value.trim();if(!b){toast('Isi materinya dulu.');return}
    notes.unshift({s:$('#n-s').value,title:t,text:b});store.set('uts.notes',notes);$('#n-t').value='';$('#n-b').value='';renderNotes();toast('Catatan disimpan.');return}
  const a=e.target.closest('[data-a]');if(!a)return;const i=+a.dataset.i,n=notes[i];
  if(a.dataset.a==='del'){notes.splice(i,1);store.set('uts.notes',notes);renderNotes();return}
  a.disabled=true;a.textContent='Memproses...';
  try{
    if(a.dataset.a==='quiz'){const c=await genQuestions(n.text,n.title);toast(c+' soal ditambahkan (mapel Soal AI).')}
    else{if(!SAMPLE)throw {message:'AI belum tersedia di tampilan ini.'};const r=await SAMPLE('Ringkas materi berikut untuk belajar UTS dalam Bahasa Indonesia: poin kunci, istilah penting beserta artinya, dan contoh singkat. Maksimal 200 kata, tanpa markdown tebal.\n\n'+n.text.slice(0,24000),{cache:false});n.sum=r.text;store.set('uts.notes',notes)}
  }catch(err){toast(AIERR(err))}
  renderNotes();
});
$('#p-saya').addEventListener('change',e=>{
  if(e.target.id!=='n-f')return;const f=e.target.files[0];if(!f)return;
  if(f.size>2e6){toast('File terlalu besar (maks 2 MB).');return}
  const rd=new FileReader();rd.onload=()=>{$('#n-b').value=String(rd.result);if(!$('#n-t').value)$('#n-t').value=f.name.replace(/\.[^.]+$/,'')};rd.readAsText(f);
});

show((location.hash||'#home').slice(1));
(async()=>{try{if(window.claude&&window.claude.use){SAMPLE=await window.claude.use('sample');setAIState()}}catch(e){}})();
